<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>HUBy Cargo - Radar de Fretes e Cargas</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#080C14">

  <!-- GUARDA DE PERFIL: Valida se é parceiro de fretes -->
  <script>
    (function () {
      const papel = localStorage.getItem('huby_user_role');
      if (papel !== 'motorista') {
        window.location.replace('./cadastro-motorista.html');
      }
    })();
  </script>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- CSS Compartilhado do Parceiro -->
  <link rel="stylesheet" href="./css/motorista.css">
</head>

<body>
  <div class="driver-layout">

    <!-- CABEÇALHO DEDICADO CARGO / FRETES -->
    <header class="driver-header">
      <div class="header-left">
        <div class="driver-avatar" id="lblAvatarMotorista" style="background: linear-gradient(135deg, #FF6B00, #C2410C);">🚚</div>
        <div class="driver-meta">
          <div class="meta-row">
            <span class="d-name" id="lblNomeMotorista">Transportador</span>
            <span class="d-badge" style="background: rgba(255, 107, 0, 0.15); color: #FF6B00;">📦 HUBy Cargo</span>
          </div>
          <span class="d-earnings" id="statGanhosHoje">Hoje: <strong>R$ 0,00</strong> (0 fretes)</span>
        </div>
      </div>

      <div class="header-right">
        <button type="button" id="btnToggleStatus" class="btn-toggle-online status-online">
          <span class="pulse-indicator"></span>
          <span id="txtStatusMotorista">ONLINE</span>
        </button>
        <button type="button" class="btn-mode-icon" id="btnSairConta" title="Encerrar Sessão">🚪</button>
      </div>
    </header>

    <!-- ÁREA TOTAL DO MAPA -->
    <main class="driver-map-wrapper">
      <div id="mapaMotorista"></div>

      <div class="radar-status-badge" id="badgeRadarStatus" style="border-color: rgba(255, 107, 0, 0.3);">
        <span class="radar-ring-pulse" style="background-color: #FF6B00;"></span>
        <span id="txtRadarStatus">A rastrear fretes e mudanças na região...</span>
      </div>

      <button type="button" id="btnRecenterGPS" class="btn-recenter-gps" aria-label="Recentralizar GPS">
        📍
      </button>
    </main>

    <!-- PAINEL DESLIZANTE INFERIOR: FILTROS DEDICADOS PARA FRETES -->
    <section class="driver-bottom-dock">
      <div class="dock-grabber"></div>

      <!-- Filtros exclusivos de cargas pesadas -->
      <div class="dock-filters">
        <button type="button" class="filter-pill active" data-filter="cargo">🚚 Todos os Fretes</button>
        <button type="button" class="filter-pill" data-filter="cargo_pickup">🛻 Picape</button>
        <button type="button" class="filter-pill" data-filter="cargo_van">🚐 Van de Carga</button>
        <button type="button" class="filter-pill" data-filter="cargo_vuc">🚛 VUC</button>
      </div>

      <!-- Feed Dinâmico -->
      <div class="driver-feed" id="feedChamadas"></div>
    </section>

  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="./js/modules/app-motorista.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const nomeSalvo = localStorage.getItem('huby_motorista_nome') || 'Parceiro Cargo';
      const elNome = document.getElementById('lblNomeMotorista');
      const elAvatar = document.getElementById('lblAvatarMotorista');

      if (elNome) elNome.textContent = nomeSalvo.split(' ')[0];

      if (elAvatar && nomeSalvo !== 'Parceiro Cargo') {
        const partes = nomeSalvo.trim().split(' ');
        elAvatar.textContent = partes.length > 1 
          ? (partes[0][0] + partes[partes.length - 1][0]).toUpperCase()
          : partes[0].substring(0, 2).toUpperCase();
      }

      document.getElementById('btnSairConta')?.addEventListener('click', () => {
        if (confirm('Deseja realmente sair da sua conta de transporte de carga?')) {
          localStorage.removeItem('huby_user_role');
          localStorage.removeItem('huby_parceiro_categoria');
          localStorage.removeItem('huby_motorista_id');
          localStorage.removeItem('huby_motorista_nome');
          window.location.href = './index.html';
        }
      });
    });
  </script>
</body>

</html>
