<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HUBy Empresas - Portal B2B de Lojistas e Fretes</title>
  <style>
    :root {
      --bg-deep: #090D16; --bg-card: #0F172A; --bg-surface: #1E293B; --border-color: #334155;
      --huby-emerald: #10B981; --huby-flash: #38BDF8; --huby-cargo: #FF6B00;
      --text-white: #FFFFFF; --text-light: #E2E8F0; --text-muted: #94A3B8; --radius-md: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-deep); color: var(--text-white); min-height: 100vh; display: flex; flex-direction: column; }
    .b2b-layout { display: flex; flex-direction: column; height: 100vh; max-width: 480px; margin: 0 auto; width: 100%; background-color: var(--bg-deep); position: relative; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
    .huby-header { background-color: var(--bg-deep); padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--bg-surface); }
    .brand-logo { display: inline-flex; align-items: center; gap: 4px; text-decoration: none; }
    .brand-hub { font-size: 26px; font-weight: 900; color: var(--text-white); letter-spacing: -1px; }
    .brand-y-badge { background-color: var(--huby-flash); color: var(--bg-deep); font-size: 19px; font-weight: 900; font-style: italic; padding: 1px 8px 3px; border-radius: 8px; position: relative; }
    .badge-pill { font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: 20px; background-color: var(--bg-surface); color: var(--text-light); text-decoration: none; }
    
    .b2b-main { flex: 1; background: #111827; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
    .card-box { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 16px; }
    .card-title { font-size: 14px; font-weight: 800; color: var(--huby-flash); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    
    .input-group { background-color: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 10px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .input-group input, .input-group select { width: 100%; background: transparent; border: none; color: var(--text-white); font-size: 13px; outline: none; }
    
    .btn-b2b { width: 100%; background-color: var(--huby-flash); color: var(--bg-deep); border: none; padding: 14px; border-radius: var(--radius-md); font-size: 14px; font-weight: 900; cursor: pointer; text-align: center; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-card { background: var(--bg-surface); padding: 12px; border-radius: 10px; text-align: center; }
    .stat-val { font-size: 18px; font-weight: 900; color: var(--huby-emerald); margin-top: 4px; }
  </style>
</head>
<body>

  <div class="b2b-layout">
    <header class="huby-header">
      <a href="./empresas.html" class="brand-logo">
        <span class="brand-hub">HUB</span>
        <span class="brand-y-badge">y</span>
      </a>
      <a href="./index.html" class="badge-pill">⬅ Voltar ao App</a>
    </header>

    <main class="b2b-main">
      <div class="stats-grid">
        <div class="stat-card">
          <div style="font-size:11px; color:var(--text-muted);">Entregas no Mês</div>
          <div class="stat-val">42</div>
        </div>
        <div class="stat-card">
          <div style="font-size:11px; color:var(--text-muted);">Fatura Faturada</div>
          <div class="stat-val">R$ 1.280</div>
        </div>
      </div>

      <div class="card-box">
        <div class="card-title">📦 Despachar Encomenda / Carga B2B</div>
        
        <div class="input-group">
          <span>🏪</span>
          <select id="selectLoja">
            <option value="matriz">Depósito Central (Sua Loja)</option>
            <option value="filial">Filial Bairro Novo</option>
          </select>
        </div>

        <div class="input-group">
          <span>📍</span>
          <input type="text" id="destB2B" placeholder="Nome do Cliente ou Endereço de Entrega">
        </div>

        <div class="input-group">
          <span>📦</span>
          <select id="selectTipoB2B">
            <option value="flash">HUBy Flash (Pacotes / E-commerce)</option>
            <option value="util">HUBy Util (Fiorino / Carga Média)</option>
            <option value="cargo">HUBy Cargo (Caminhão / Grande Volume)</option>
          </select>
        </div>

        <div class="input-group">
          <span>💵</span>
          <input type="text" id="valorCobrar" placeholder="Valor a cobrar na entrega (Reembolso Pix/Dinheiro)">
        </div>

        <button type="button" class="btn-b2b" id="btnDespacharB2B">Despachar com Motoboy/Utilitário</button>
      </div>

      <div class="card-box">
        <div class="card-title">📋 Últimos Envios B2B</div>
        <div style="font-size:12px; color:var(--text-muted); display:flex; flex-direction:column; gap:6px;">
          <div style="display:flex; justify-content:space-between; border-bottom:1px solid var(--border-color); padding-bottom:6px;">
            <span>Pedido #4821 - Cliente João M.</span>
            <span style="color:var(--huby-emerald);">Entregue ✅</span>
          </div>
          <div style="display:flex; justify-content:space-between; padding-top:4px;">
            <span>Pedido #4822 - Loja Centro</span>
            <span style="color:var(--huby-flash);">Em trânsito 🛵</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    document.getElementById('btnDespacharB2B').onclick = () => {
      const dest = document.getElementById('destB2B').value;
      if (!dest) {
        alert('Insira o endereço de entrega do cliente B2B.');
        return;
      }
      alert('🚀 Encomenda despachada com sucesso para a frota HUBy! O motoboy mais próximo foi alocado.');
      document.getElementById('destB2B').value = '';
    };
  </script>
</body>
</html>
