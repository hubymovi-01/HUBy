<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Iniciar Sessão • HUBy</title>

  <!-- PWA & CORES DO SISTEMA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0B0F19">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HUBy">

  <!-- ÍCONES -->
  <link rel="apple-touch-icon" sizes="192x192" href="./img/icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="./img/icon-512.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./img/icon-192.png">

  <link rel="stylesheet" href="./css/base.css?v=2.2.1">
  <link rel="stylesheet" href="./css/auth.css?v=2.3.0">
  <style>
    .senha-wrapper { position: relative; }
    .senha-wrapper input { padding-right: 70px; }
    .btn-ver-senha {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      color: #94A3B8; font-size: 11px; font-weight: 800; padding: 6px 9px;
      border-radius: 8px; cursor: pointer;
    }
    .link-trocar-perfil {
      display: block; text-align: center; margin-top: 14px;
      font-size: 12px; color: #94A3B8; text-decoration: underline; cursor: pointer;
    }
  </style>
</head>
<body class="auth-body">

  <div class="auth-ambient-glow"></div>

  <main class="auth-container">
    <div class="auth-card">
      <header class="auth-header">
        <div id="badgeLogin" class="auth-badge" style="margin-bottom: 12px; display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 800;">Entrar</div>
        <h1 class="auth-brand">HUB<span>y</span></h1>
        <p id="txtSubtituloLogin" class="auth-desc">Entre na sua conta para continuar</p>
      </header>

      <div id="alertaLoginBox" class="auth-alert" style="display: none; padding: 10px; border-radius: 8px; margin-bottom: 14px; font-size: 13px;"></div>

      <!-- FORMULÁRIO 1: LOGIN DE PASSAGEIRO -->
      <form id="formLoginCliente" class="auth-form" style="display: none;" novalidate>
        <div class="input-group">
          <label for="loginIdentificador">E-mail, telefone ou CPF</label>
          <input type="text" id="loginIdentificador" placeholder="Seu e-mail, telefone ou CPF" autocomplete="username" required>
        </div>

        <div class="input-group">
          <label for="loginSenha">Senha</label>
          <div class="senha-wrapper">
            <input type="password" id="loginSenha" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="btn-ver-senha" data-alvo="loginSenha">Ver</button>
          </div>
        </div>

        <button type="submit" id="btnSubmeterCliente" class="btn-primary-action">
          <span>Entrar como Passageiro</span>
        </button>
      </form>

      <!-- FORMULÁRIO 2: LOGIN DE MOTORISTA (E-MAIL/TELEFONE/CPF + SENHA) -->
      <form id="formLoginMotorista" class="auth-form" style="display: none;" novalidate>
        <div class="input-group">
          <label for="loginIdentificadorMot">E-mail, telefone ou CPF</label>
          <input type="text" id="loginIdentificadorMot" placeholder="O mesmo usado no cadastro" autocomplete="username" required>
        </div>

        <div class="input-group">
          <label for="loginSenhaMot">Senha</label>
          <div class="senha-wrapper">
            <input type="password" id="loginSenhaMot" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="btn-ver-senha" data-alvo="loginSenhaMot">Ver</button>
          </div>
        </div>

        <button type="submit" id="btnSubmeterMotorista" class="btn-primary-action" style="margin-top: 20px;">
          <span>Entrar no Painel do Parceiro</span>
        </button>
      </form>

      <a id="linkEsqueciSenha" class="link-trocar-perfil" href="./esqueci-senha.html">Esqueci minha senha</a>
      <a id="linkTrocarPerfil" class="link-trocar-perfil"></a>

      <footer class="auth-footer-nav" style="margin-top: 20px;">
        <span>Ainda não tem conta?</span>
        <a href="./cadastro.html" id="linkCriarConta">Criar conta</a>
      </footer>
    </div>
  </main>

  <script type="module">
    import { API_URL } from './js/config.js';

    const urlParams = new URLSearchParams(window.location.search);
    const perfil = (urlParams.get('perfil') || localStorage.getItem('huby_tipo_acesso') || 'cliente') === 'motorista'
      ? 'motorista'
      : 'cliente';

    const formCliente = document.getElementById('formLoginCliente');
    const formMotorista = document.getElementById('formLoginMotorista');
    const txtSubtitulo = document.getElementById('txtSubtituloLogin');
    const badgeLogin = document.getElementById('badgeLogin');
    const linkCriarConta = document.getElementById('linkCriarConta');
    const linkTrocarPerfil = document.getElementById('linkTrocarPerfil');
    const alertaBox = document.getElementById('alertaLoginBox');
    document.getElementById('linkEsqueciSenha').href = `./esqueci-senha.html?perfil=${perfil}`;
    
    if (perfil === 'motorista') {
      formMotorista.style.display = 'block';
      txtSubtitulo.textContent = 'Acesso exclusivo para Motoristas Parceiros';
      badgeLogin.textContent = '🚘 Área do Parceiro';
      badgeLogin.style.background = 'rgba(16, 185, 129, 0.15)';
      badgeLogin.style.color = '#10B981';
      linkCriarConta.href = './cadastro.html?perfil=motorista';
      linkTrocarPerfil.textContent = 'Sou passageiro';
      linkTrocarPerfil.href = './login.html?perfil=cliente';
    } else {
      formCliente.style.display = 'block';
      txtSubtitulo.textContent = 'Entre na sua conta de Passageiro';
      badgeLogin.textContent = '👤 Passageiro';
      badgeLogin.style.background = 'rgba(56, 189, 248, 0.15)';
      badgeLogin.style.color = '#38BDF8';
      linkCriarConta.href = './cadastro.html?perfil=cliente';
      linkTrocarPerfil.textContent = 'Sou motorista parceiro';
      linkTrocarPerfil.href = './login.html?perfil=motorista';
    }

    // Aviso de sessão expirada (deixado pelo js/sessao-expirada.js)
    (() => {
      let aviso = '';
      try {
        aviso = sessionStorage.getItem('huby_aviso_login') || '';
        sessionStorage.removeItem('huby_aviso_login');
      } catch (e) {}

      if (!aviso && urlParams.get('expirou') === '1') {
        aviso = 'Sua sessão expirou. Entre novamente.';
      }

      if (aviso) {
        exibirAlerta(`⏳ ${aviso.slice(0, 200)}`, 'warning');
      }

      // Tira o "expirou=1" do endereço (recarregar a página não mostra o aviso de novo)
      if (urlParams.has('expirou')) {
        urlParams.delete('expirou');
        const resto = urlParams.toString();
        history.replaceState(null, '', `${location.pathname}${resto ? `?${resto}` : ''}`);
      }
    })();

    // Mostrar / esconder senha
    document.querySelectorAll('.btn-ver-senha').forEach((btn) => {
      btn.addEventListener('click', () => {
        const alvo = document.getElementById(btn.getAttribute('data-alvo'));
        if (!alvo) return;
        const mostrar = alvo.type === 'password';
        alvo.type = mostrar ? 'text' : 'password';
        btn.textContent = mostrar ? 'Ocultar' : 'Ver';
      });
    });

    async function enviarLogin(url, corpo) {
      const resp = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(corpo)
      });
      const data = await resp.json().catch(() => ({}));
      if (resp.status === 429) {
        throw new Error('Muitas tentativas. Aguarde alguns minutos e tente novamente.');
      }
      if (!resp.ok) throw new Error(data.erro || 'Credenciais inválidas.');
      if (!data.token || !data.usuario) throw new Error('Resposta inválida do servidor.');
      return data;
    }

    // Login Passageiro
    formCliente.addEventListener('submit', async (e) => {
      e.preventDefault();
      esconderAlerta();
      const identificador = document.getElementById('loginIdentificador').value.trim();
      const senha = document.getElementById('loginSenha').value;

      if (!identificador || !senha) return exibirAlerta('Preencha todos os campos.', 'error');

      const btnSub = document.getElementById('btnSubmeterCliente');
      btnSub.disabled = true;
      btnSub.querySelector('span').textContent = 'Entrando...';

      try {
        const data = await enviarLogin(`${API_URL}/api/auth/login`, { identificador, senha, perfilDesejado: 'cliente' });
        const role = String(data.usuario.role || 'cliente').toLowerCase();
        const destino = role === 'admin'
          ? './admin.html'
          : (role === 'motorista' ? './motorista.html' : './index.html');
        guardarSessaoERedirecionar(data, destino);
      } catch (err) {
        exibirAlerta(err.message, 'error');
        btnSub.disabled = false;
        btnSub.querySelector('span').textContent = 'Entrar como Passageiro';
      }
    });

    // Login Motorista (identificador + senha)
    formMotorista.addEventListener('submit', async (e) => {
      e.preventDefault();
      esconderAlerta();

      const identificador = document.getElementById('loginIdentificadorMot').value.trim();
      const senha = document.getElementById('loginSenhaMot').value;

      if (!identificador || !senha) return exibirAlerta('Informe seu e-mail (ou telefone/CPF) e a senha.', 'error');

      const btnSub = document.getElementById('btnSubmeterMotorista');
      btnSub.disabled = true;
      btnSub.querySelector('span').textContent = 'Verificando...';

      try {
        const data = await enviarLogin(`${API_URL}/api/auth/login-motorista`, { identificador, senha });
        guardarSessaoERedirecionar(data, './motorista.html');
      } catch (err) {
        exibirAlerta(err.message, 'error');
        btnSub.disabled = false;
        btnSub.querySelector('span').textContent = 'Entrar no Painel do Parceiro';
      }
    });

    function guardarSessaoERedirecionar(data, urlDestino) {
      // Limpa dados de uma sessão anterior (outra conta no mesmo aparelho)
      [
        'huby_token', 'huby_user_role', 'huby_user_name', 'huby_user_id',
        'huby_motorista_id', 'huby_status_aprovacao', 'huby_motorista_online',
        'huby_corrida_ativa_mot_id', 'huby_pedido_ativo_id'
      ].forEach((k) => localStorage.removeItem(k));

      const u = data.usuario;
      localStorage.setItem('huby_token', data.token);
      localStorage.setItem('huby_user_role', u.role || 'cliente');
      localStorage.setItem('huby_user_name', u.nome || '');
      localStorage.setItem('huby_user_id', u.id);
      localStorage.setItem('huby_tipo_acesso', u.role === 'motorista' ? 'motorista' : 'cliente');

      if (u.motoristaId) {
        localStorage.setItem('huby_motorista_id', u.motoristaId);
      }
      if (u.status_aprovacao) {
        localStorage.setItem('huby_status_aprovacao', u.status_aprovacao);
      }

      if (data.aviso) {
        exibirAlerta(data.aviso, 'warning');
        setTimeout(() => window.location.replace(urlDestino), 2200);
      } else {
        exibirAlerta('Login efetuado com sucesso!', 'success');
        setTimeout(() => window.location.replace(urlDestino), 600);
      }
    }

    function exibirAlerta(msg, tipo) {
      if (!alertaBox) return;
      const cores = {
        error: { bg: 'rgba(239, 68, 68, 0.15)', borda: 'rgba(239, 68, 68, 0.3)', txt: '#F87171' },
        warning: { bg: 'rgba(245, 158, 11, 0.15)', borda: 'rgba(245, 158, 11, 0.35)', txt: '#FBBF24' },
        success: { bg: 'rgba(16, 185, 129, 0.15)', borda: 'rgba(16, 185, 129, 0.3)', txt: '#10B981' }
      };
      const c = cores[tipo] || cores.success;
      alertaBox.textContent = msg;
      alertaBox.style.display = 'block';
      alertaBox.style.background = c.bg;
      alertaBox.style.border = `1px solid ${c.borda}`;
      alertaBox.style.color = c.txt;
    }

    function esconderAlerta() {
      if (alertaBox) alertaBox.style.display = 'none';
    }
  </script>
</body>
</html>
