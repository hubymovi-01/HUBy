<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Iniciar Sessão • HUBy</title>
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/auth.css">
</head>
<body class="auth-body">

  <div class="auth-ambient-glow"></div>

  <main class="auth-container">
    <div class="auth-card">

      <!-- CABEÇALHO DA MARCA -->
      <header class="auth-header">
        <div class="auth-badge">Acesso Seguro HUBy</div>
        <h1 class="auth-brand">HUB<span>y</span></h1>
        <p id="txtSubtituloLogin" class="auth-desc">Inicie sessão para solicitar corridas</p>
      </header>

      <!-- SELETOR DE PERFIL: PASSAGEIRO VS MOTORISTA -->
      <div class="role-selector">
        <button type="button" id="btnLoginRoleCliente" class="btn-role active">
          <span class="role-icon">👤</span>
          <span class="role-name">Passageiro</span>
        </button>
        <button type="button" id="btnLoginRoleMotorista" class="btn-role">
          <span class="role-icon">🚘</span>
          <span class="role-name">Motorista Parceiro</span>
        </button>
      </div>

      <!-- ALERTA INTEGRADO (SEM ALERT NATIVO) -->
      <div id="alertaLoginBox" class="auth-alert" style="display: none;"></div>

      <!-- FORMULÁRIO DE LOGIN -->
      <form id="formLoginHuby" class="auth-form" novalidate>
        
        <div class="input-group">
          <label for="loginIdentificador" id="lblIdentificador">E-mail, Telefone ou CPF</label>
          <div class="input-wrapper">
            <span class="input-ico" id="icoIdentificador">✉️</span>
            <input 
              type="text" 
              id="loginIdentificador" 
              placeholder="Digite o seu acesso" 
              autocomplete="username" 
              required
            >
          </div>
        </div>

        <div class="input-group">
          <label for="loginSenha">Palavra-passe</label>
          <div class="input-wrapper">
            <span class="input-ico">🔒</span>
            <input 
              type="password" 
              id="loginSenha" 
              placeholder="••••••••" 
              autocomplete="current-password" 
              required
            >
            <button type="button" id="btnToggleLoginSenha" class="btn-toggle-eye" aria-label="Ver palavra-passe">👁️</button>
          </div>
        </div>

        <button type="submit" id="btnSubmeterLogin" class="btn-primary-action">
          <span>Entrar como Passageiro</span>
        </button>
      </form>

      <!-- NAVEGAÇÃO DE RODAPÉ -->
      <footer class="auth-footer-nav">
        <span>Novo no HUBy?</span>
        <a href="./cadastro.html">Criar nova conta</a>
      </footer>

      <div style="text-align: center; margin-top: 14px;">
        <a href="./index.html" style="color: var(--text-dim); text-decoration: none; font-size: 12px; font-weight: 700;">
          ← Voltar ao Mapa
        </a>
      </div>

    </div>
  </main>

  <script type="module">
    import { API_URL } from './js/config.js';

    let roleLoginAtual = 'cliente';

    
    const btnRoleCliente = document.getElementById('btnLoginRoleCliente');
    const btnRoleMotorista = document.getElementById('btnLoginRoleMotorista');
    const txtSubtitulo = document.getElementById('txtSubtituloLogin');
    const lblIdentificador = document.getElementById('lblIdentificador');
    const icoIdentificador = document.getElementById('icoIdentificador');
    const inputIdentificador = document.getElementById('loginIdentificador');
    const inputSenha = document.getElementById('loginSenha');
    const btnToggleSenha = document.getElementById('btnToggleLoginSenha');
    const btnSubmit = document.getElementById('btnSubmeterLogin');
    const alertaBox = document.getElementById('alertaLoginBox');

    // 1. Alternador de Perfil
    btnRoleCliente.onclick = () => {
      roleLoginAtual = 'cliente';
      btnRoleCliente.classList.add('active');
      btnRoleMotorista.classList.remove('active');
      txtSubtitulo.textContent = 'Inicie sessão para solicitar corridas';
      lblIdentificador.textContent = 'E-mail, Telefone ou CPF';
      icoIdentificador.textContent = '✉️';
      inputIdentificador.placeholder = 'Digite o seu acesso';
      btnSubmit.querySelector('span').textContent = 'Entrar como Passageiro';
      esconderAlerta();
    };

    btnRoleMotorista.onclick = () => {
      roleLoginAtual = 'motorista';
      btnRoleMotorista.classList.add('active');
      btnRoleCliente.classList.remove('active');
      txtSubtitulo.textContent = 'Aceda ao radar de corridas e gerencie os seus ganhos';
      lblIdentificador.textContent = 'CNH, Telefone ou E-mail';
      icoIdentificador.textContent = '🪪';
      inputIdentificador.placeholder = 'Digite a sua CNH, telefone ou e-mail';
      btnSubmit.querySelector('span').textContent = 'Entrar como Motorista Parceiro';
      esconderAlerta();
    };

    // 2. Alternar visualização da senha
    btnToggleSenha.onclick = () => {
      const isPass = inputSenha.type === 'password';
      inputSenha.type = isPass ? 'text' : 'password';
      btnToggleSenha.textContent = isPass ? '🔒' : '👁️';
    };

    // 3. Submissão autenticada compatível com o server.js
    document.getElementById('formLoginHuby').onsubmit = async (e) => {
      e.preventDefault();
      esconderAlerta();

      const identificador = inputIdentificador.value.trim();
      const senha = inputSenha.value.trim();

      if (!identificador || !senha) {
        exibirAlerta('Indique os seus dados de acesso e a palavra-passe.', 'error');
        return;
      }

      try {
        btnSubmit.disabled = true;
        btnSubmit.querySelector('span').textContent = 'A autenticar credenciais...';

        const resp = await fetch(`${API_URL}/api/usuarios/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            identificador,
            senha,
            perfilDesejado: roleLoginAtual
          })
        });

        // Verificação se a resposta foi um HTML por erro de infraestrutura
        const contentType = resp.headers.get('content-type');
        if (!contentType || !contentType.includes('application/json')) {
          throw new Error('Servidor indisponível ou a iniciar. Aguarde 20 segundos e tente de novo.');
        }

        const data = await resp.json();
        if (!resp.ok) {
          throw new Error(data.erro || 'Falha ao validar credenciais.');
        }

        // Armazenamento da sessão
        localStorage.setItem('huby_token', data.token);
        localStorage.setItem('huby_user_id', data.usuario.id);
        localStorage.setItem('huby_user_name', data.usuario.nome);
        localStorage.setItem('huby_user_role', data.usuario.role);
        if (data.usuario.telefone) {
          localStorage.setItem('huby_user_phone', data.usuario.telefone);
        }

        exibirAlerta('Sessão iniciada com sucesso! A carregar...', 'success');

        setTimeout(() => {
          if (data.usuario.role === 'motorista') {
            window.location.replace('./motorista.html');
          } else {
            window.location.replace('./index.html');
          }
        }, 800);

      } catch (err) {
        exibirAlerta(err.message, 'error');
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.querySelector('span').textContent = roleLoginAtual === 'cliente'
          ? 'Entrar como Passageiro'
          : 'Entrar como Motorista Parceiro';
      }
    };

    function exibirAlerta(msg, tipo) {
      alertaBox.textContent = msg;
      alertaBox.className = `auth-alert ${tipo}`;
      alertaBox.style.display = 'block';
    }

    function esconderAlerta() {
      alertaBox.style.display = 'none';
    }
  </script>
</body>
</html>
