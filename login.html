<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Iniciar Sessão • HUBy</title>

  <!-- PWA & CORES DO SISTEMA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0B0F19">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HUBy">

  <!-- ÍCONES -->
  <link rel="apple-touch-icon" sizes="192x192" href="./img/icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="./img/icon-512.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./img/icon-192.png">

  <link rel="stylesheet" href="./css/base.css?v=2.2.1">
  <link rel="stylesheet" href="./css/auth.css?v=2.2.1">
</head>
<body class="auth-body">

  <div class="auth-ambient-glow"></div>

  <main class="auth-container">
    <div class="auth-card">
      <header class="auth-header">
        <div id="badgeLogin" class="auth-badge" style="margin-bottom: 12px; display: inline-block;">Entrar</div>
        <h1 class="auth-brand">HUB<span>y</span></h1>
        <p id="txtSubtituloLogin" class="auth-desc">Entre na sua conta para continuar</p>
      </header>

      <div id="alertaLoginBox" class="auth-alert" style="display: none; padding: 10px; border-radius: 8px; margin-bottom: 14px; font-size: 13px;"></div>

      <!-- FORMULÁRIO 1: LOGIN DE PASSAGEIRO / ADMIN (ETAPA 1) -->
      <form id="formLoginCliente" class="auth-form" style="display: none;" novalidate>
        <div class="input-group">
          <label>E-mail ou Telemóvel</label>
          <input type="text" id="loginIdentificador" placeholder="Seu e-mail ou telemóvel" required>
        </div>

        <div class="input-group">
          <label>Palavra-passe</label>
          <input type="password" id="loginSenha" placeholder="••••••••" required>
        </div>

        <button type="submit" id="btnSubmeterCliente" class="btn-primary-action">
          <span>Entrar na Plataforma</span>
        </button>
      </form>

      <!-- FORMULÁRIO DE 2FA: VERIFICAÇÃO EM DUAS ETAPAS (ADMIN) (ETAPA 2) -->
      <form id="formVerificacao2FA" class="auth-form" style="display: none;" novalidate>
        <div style="text-align: center; margin-bottom: 16px;">
          <div style="background: rgba(16, 185, 129, 0.15); color: #10b981; font-size: 32px; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; border-radius: 50%; margin: 0 auto 10px;">
            🔐
          </div>
          <strong style="color: #FFF; font-size: 16px;">Verificação em Duas Etapas</strong>
          <p style="color: #94A3B8; font-size: 12px; margin-top: 6px;" id="lblInfo2FA">
            Enviamos um código de segurança de 6 dígitos para o seu e-mail.
          </p>
        </div>

        <div class="input-group">
          <input type="tel" id="codigo2FA" placeholder="000000" maxlength="6" 
                 style="text-align: center; font-size: 24px; letter-spacing: 8px; font-weight: 900; background: #070B12; border: 1.5px solid #10b981;" required>
        </div>

        <button type="submit" id="btnSubmeter2FA" class="btn-primary-action" style="background: #10b981; color: #000; box-shadow: 0 4px 18px rgba(16, 185, 129, 0.4);">
          <span>Confirmar e Entrar Master</span>
        </button>

        <div style="text-align: center; margin-top: 14px;">
          <a href="#" id="linkVoltarLogin" style="color: #94A3B8; font-size: 12px; text-decoration: none;">⟵ Voltar</a>
        </div>
      </form>

      <!-- FORMULÁRIO 3: LOGIN DE MOTORISTA -->
      <form id="formLoginMotorista" class="auth-form" style="display: none;" novalidate>
        <div class="input-group">
          <label>E-mail de Registo</label>
          <input type="email" id="loginEmailMot" placeholder="seu@email.com" required>
        </div>

        <div class="input-group">
          <label>Nº da CNH</label>
          <input type="tel" id="loginCNH" placeholder="Digite os 11 dígitos da CNH" maxlength="11" required>
        </div>

        <div class="input-group">
          <label>Placa do Veículo</label>
          <input type="text" id="loginPlaca" placeholder="ABC1D23" style="text-transform: uppercase;" maxlength="7" required>
        </div>

        <button type="submit" id="btnSubmeterMotorista" class="btn-primary-action" style="margin-top: 20px;">
          <span>Aceder ao Painel Parceiro</span>
        </button>
      </form>

      <footer class="auth-footer-nav" style="margin-top: 20px;" id="rodapeCadastro">
        <span>Ainda não tem conta?</span>
        <a href="#" id="linkCriarConta">Criar conta</a>
      </footer>
    </div>
  </main>

  <script type="module">
    import { API_URL } from './js/config.js';

    const urlParams = new URLSearchParams(window.location.search);
    const perfil = urlParams.get('perfil') || localStorage.getItem('huby_tipo_acesso') || 'cliente';

    const formCliente = document.getElementById('formLoginCliente');
    const form2FA = document.getElementById('formVerificacao2FA');
    const formMotorista = document.getElementById('formLoginMotorista');
    const rodapeCadastro = document.getElementById('rodapeCadastro');
    const txtSubtitulo = document.getElementById('txtSubtituloLogin');
    const badgeLogin = document.getElementById('badgeLogin');
    const linkCriarConta = document.getElementById('linkCriarConta');
    const alertaBox = document.getElementById('alertaLoginBox');

    let adminIdPendente2FA = null;

    if (perfil === 'motorista') {
      formMotorista.style.display = 'block';
      txtSubtitulo.textContent = 'Acesso exclusivo para Motoristas Parceiros';
      badgeLogin.textContent = '🚘 Área do Parceiro';
      badgeLogin.style.background = 'rgba(16, 185, 129, 0.15)';
      badgeLogin.style.color = '#10B981';
      linkCriarConta.href = './cadastro.html?perfil=motorista';
    } else {
      formCliente.style.display = 'block';
      txtSubtitulo.textContent = 'Entre na sua conta para continuar';
      badgeLogin.textContent = '👤 Utilizador';
      linkCriarConta.href = './cadastro.html?perfil=cliente';
    }

    // =========================================================================
    // ETAPA 1: Login de Passageiro ou Admin
    // =========================================================================
    formCliente.addEventListener('submit', async (e) => {
      e.preventDefault();
      esconderAlerta();
      const identificador = document.getElementById('loginIdentificador').value.trim();
      const senha = document.getElementById('loginSenha').value;

      if (!identificador || !senha) return exibirAlerta('Preencha todos os campos.', 'error');

      const btnSub = document.getElementById('btnSubmeterCliente');
      btnSub.disabled = true;
      btnSub.querySelector('span').textContent = 'A entrar...';

      try {
        const resp = await fetch(`${API_URL}/api/usuarios/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identificador, senha })
        });
        const data = await resp.json();

        if (!resp.ok) {
          throw new Error(data.erro || 'Credenciais inválidas.');
        }

        // Se o sistema solicitar 2FA (Admin Master)
        if (data.requer_2fa) {
          adminIdPendente2FA = data.usuario_id;
          formCliente.style.display = 'none';
          rodapeCadastro.style.display = 'none';
          form2FA.style.display = 'block';
          badgeLogin.style.display = 'none';
          txtSubtitulo.style.display = 'none';
          
          if (data.codigoTeste) {
            // Em dev, mostra o código para teste rápido no navegador
            console.log(`CÓDIGO 2FA ADMIN: ${data.codigoTeste}`);
          }
          exibirAlerta('Código de acesso enviado ao seu e-mail.', 'success');
          setTimeout(() => document.getElementById('codigo2FA').focus(), 100);
          return;
        }

        // Se for passageiro, entra direto
        guardarSessaoERedirecionar(data, './index.html');
      } catch (err) {
        exibirAlerta(err.message, 'error');
      } finally {
        btnSub.disabled = false;
        btnSub.querySelector('span').textContent = 'Entrar na Plataforma';
      }
    });

    // =========================================================================
    // ETAPA 2: Validação 2FA (Acesso Exclusivo Master)
    // =========================================================================
    form2FA.addEventListener('submit', async (e) => {
      e.preventDefault();
      esconderAlerta();
      
      const codigo = document.getElementById('codigo2FA').value.trim();
      if (codigo.length !== 6) return exibirAlerta('Digite o código de 6 dígitos completo.', 'error');

      const btnSub2FA = document.getElementById('btnSubmeter2FA');
      btnSub2FA.disabled = true;
      btnSub2FA.querySelector('span').textContent = 'Validando Segurança...';

      try {
        const resp = await fetch(`${API_URL}/api/usuarios/validar-2fa`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario_id: adminIdPendente2FA, codigo })
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.erro || 'Código inválido.');

        guardarSessaoERedirecionar(data, './admin.html');
      } catch (err) {
        exibirAlerta(err.message, 'error');
        btnSub2FA.disabled = false;
        btnSub2FA.querySelector('span').textContent = 'Confirmar e Entrar Master';
      }
    });

    document.getElementById('linkVoltarLogin').addEventListener('click', (e) => {
      e.preventDefault();
      form2FA.style.display = 'none';
      formCliente.style.display = 'block';
      rodapeCadastro.style.display = 'block';
      badgeLogin.style.display = 'inline-block';
      txtSubtitulo.style.display = 'block';
      adminIdPendente2FA = null;
      esconderAlerta();
    });

    // Formata o input 2FA (apenas números)
    document.getElementById('codigo2FA').addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
    });

    // =========================================================================
    // LOGIN MOTORISTA (MANTIDO INTACTO)
    // =========================================================================
    formMotorista.addEventListener('submit', async (e) => {
      e.preventDefault();
      esconderAlerta();
      
      const email = document.getElementById('loginEmailMot').value.trim();
      const cnh = document.getElementById('loginCNH').value.trim();
      const placa = document.getElementById('loginPlaca').value.trim().toUpperCase();

      if (!email || !cnh || !placa) {
        return exibirAlerta('Preencha E-mail, CNH e Placa.', 'error');
      }

      const btnSub = document.getElementById('btnSubmeterMotorista');
      btnSub.disabled = true;
      btnSub.querySelector('span').textContent = 'A verificar dados...';

      try {
        const resp = await fetch(`${API_URL}/api/usuarios/login-motorista`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, cnh, veiculo_placa: placa })
        });
        
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.erro || 'Dados do veículo ou credenciais não encontrados.');

        guardarSessaoERedirecionar(data, './motorista.html');
      } catch (err) {
        exibirAlerta(err.message, 'error');
        btnSub.disabled = false;
        btnSub.querySelector('span').textContent = 'Aceder ao Painel Parceiro';
      }
    });

    document.getElementById('loginCNH').addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/\D/g, '').slice(0, 11);
    });

    // Gestão de Sessão (Trata 'funcao' ou 'role')
    function guardarSessaoERedirecionar(data, urlDestinoPadrao) {
      localStorage.setItem('huby_token', data.token);

      const papelBruto = data.usuario?.funcao || data.usuario?.role || 'cliente';
      const papelNormalizado = String(papelBruto).trim().toLowerCase();

      localStorage.setItem('huby_user_role', papelNormalizado);
      localStorage.setItem('huby_user_name', data.usuario?.nome || 'Utilizador');
      localStorage.setItem('huby_user_id', data.usuario?.id);

      // NOVO: SALVA A CATEGORIA DO MOTORISTA NO NAVEGADOR
      if (papelNormalizado === 'motorista') {
        localStorage.setItem('huby_motorista_id', data.usuario?.motoristaId || data.usuario?.id);
        
        const cat = data.usuario?.categoria || 'carro';
        localStorage.setItem('huby_motorista_categoria', cat);
      }

      exibirAlerta('Sessão iniciada com sucesso! Conectando...', 'success');
      
      let urlRedirecionamento = urlDestinoPadrao;
      if (papelNormalizado === 'admin' || papelNormalizado === 'administrador') {
        urlRedirecionamento = './admin.html';
      } else if (papelNormalizado === 'motorista') {
        urlRedirecionamento = './motorista.html';
      } else {
        urlRedirecionamento = './index.html';
      }

      setTimeout(() => window.location.replace(urlRedirecionamento), 600);
    }

    function exibirAlerta(msg, tipo) {
      if (!alertaBox) return;
      alertaBox.textContent = msg;
      alertaBox.className = `auth-alert ${tipo}`;
      alertaBox.style.display = 'block';
      alertaBox.style.background = tipo === 'error' ? 'rgba(239, 68, 68, 0.15)' : 'rgba(16, 185, 129, 0.15)';
      alertaBox.style.border = `1px solid ${tipo === 'error' ? 'rgba(239, 68, 68, 0.3)' : 'rgba(16, 185, 129, 0.3)'}`;
      alertaBox.style.color = tipo === 'error' ? '#F87171' : '#10B981';
    }

    function esconderAlerta() {
      if (alertaBox) alertaBox.style.display = 'none';
    }
  </script>
</body>
</html>
