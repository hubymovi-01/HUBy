<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Iniciar Sessão • HUBy</title>
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/auth.css">
</head>
<body class="auth-body">

  <div class="auth-ambient-glow"></div>

  <main class="auth-container">
    <div class="auth-card">
      <header class="auth-header">
        <h1 class="auth-brand">HUB<span>y</span></h1>
        <p class="auth-desc">Entre na sua conta para continuar</p>
      </header>

      <div id="alertaLoginBox" class="auth-alert" style="display: none;"></div>

      <form id="formLoginHuby" class="auth-form" novalidate>
        <div class="input-group">
          <label>E-mail ou Telemóvel</label>
          <input type="text" id="loginIdentificador" placeholder="Seu e-mail ou telemóvel" required>
        </div>

        <div class="input-group">
          <label>Palavra-passe</label>
          <input type="password" id="loginSenha" placeholder="••••••••" required>
        </div>

        <button type="submit" id="btnSubmeterLogin" class="btn-primary-action">
          <span>Entrar na Conta</span>
        </button>
      </form>

      <footer class="auth-footer-nav">
        <span>Ainda não tem conta?</span>
        <a href="./cadastro.html">Criar conta</a>
      </footer>
    </div>
  </main>

  <script type="module">
    import { API_URL } from './js/config.js';

    const alertaBox = document.getElementById('alertaLoginBox');

    document.getElementById('formLoginHuby').addEventListener('submit', async (e) => {
      e.preventDefault();
      esconderAlerta();

      const identificador = document.getElementById('loginIdentificador').value.trim();
      const senha = document.getElementById('loginSenha').value;

      if (!identificador || !senha) {
        exibirAlerta('Preencha todos os campos.', 'error');
        return;
      }

      try {
        const btnSub = document.getElementById('btnSubmeterLogin');
        btnSub.disabled = true;
        btnSub.querySelector('span').textContent = 'A entrar...';

        const resp = await fetch(`${API_URL}/api/usuarios/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identificador, senha })
        });

        const data = await resp.json();
        if (!resp.ok) throw new Error(data.erro || 'Credenciais inválidas.');

        localStorage.setItem('huby_token', data.token);
        localStorage.setItem('huby_user_role', data.usuario.role);
        localStorage.setItem('huby_user_name', data.usuario.nome);
        localStorage.setItem('huby_user_phone', data.usuario.telefone || '');

        exibirAlerta('Login efetuado com sucesso!', 'success');
        setTimeout(() => {
          window.location.replace(data.usuario.role === 'motorista' ? './motorista.html' : './index.html');
        }, 600);

      } catch (err) {
        exibirAlerta(err.message, 'error');
        const btnSub = document.getElementById('btnSubmeterLogin');
        btnSub.disabled = false;
        btnSub.querySelector('span').textContent = 'Entrar na Conta';
      }
    });

    function exibirAlerta(msg, tipo) {
      if (!alertaBox) return;
      alertaBox.textContent = msg;
      alertaBox.className = `auth-alert ${tipo}`;
      alertaBox.style.display = 'block';
      alertaBox.style.background = tipo === 'error' ? 'rgba(239, 68, 68, 0.15)' : 'rgba(16, 185, 129, 0.15)';
      alertaBox.style.border = `1px solid ${tipo === 'error' ? 'rgba(239, 68, 68, 0.3)' : 'rgba(16, 185, 129, 0.3)'}`;
      alertaBox.style.color = tipo === 'error' ? '#F87171' : '#10B981';
    }

    function esconderAlerta() {
      if (!alertaBox) return;
      alertaBox.style.display = 'none';
    }
  </script>
</body>
</html>
