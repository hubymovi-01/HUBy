<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>HUBy - Acessar Conta</title>
  <link rel="stylesheet" href="./css/global.css">
  <link rel="stylesheet" href="./css/login.css">
</head>

<body>
  <div class="login-wrapper">
    <div class="glow-bg top-glow"></div>
    <div class="glow-bg bottom-glow"></div>

    <div class="login-card">
      <div class="login-top-bar">
        <a href="./index.html" class="btn-back" title="Voltar ao início">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </a>
        <div class="security-badge">
          <span>🛡️ Conexão Segura</span>
        </div>
      </div>

      <header class="login-brand">
        <div class="brand-title">
          <span class="brand-hub">HUB</span><span class="brand-y">y</span>
        </div>
        <h2>Acessar sua Conta</h2>
        <p>Informe suas credenciais para gerenciar viagens, entregas e serviços.</p>
      </header>

      <form id="formLogin" class="login-form" autocomplete="on">
        <div class="form-group">
          <label for="loginEmail">E-mail</label>
          <div class="input-container">
            <span class="input-icon">✉️</span>
            <input 
              type="email" 
              id="loginEmail" 
              name="email" 
              class="form-input" 
              placeholder="seuemail@exemplo.com" 
              required 
              autocomplete="email"
            >
          </div>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="loginSenha">Senha</label>
            <a href="#" class="forgot-link" tabindex="-1">Esqueceu?</a>
          </div>
          <div class="input-container">
            <span class="input-icon">🔒</span>
            <input 
              type="password" 
              id="loginSenha" 
              name="password" 
              class="form-input has-action" 
              placeholder="••••••••" 
              required 
              autocomplete="current-password"
            >
            <button type="button" class="btn-toggle-eye" id="btnTogglePassword" aria-label="Mostrar ou ocultar senha">
              <svg id="eyeOpenIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg id="eyeSlashIcon" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="btnLoginSubmit">
          <span class="btn-text">Entrar no HUBy</span>
          <span class="btn-arrow">➔</span>
        </button>
      </form>

      <footer class="login-footer">
        <p>Ainda não tem conta? <a href="./cadastro-cliente.html">Cadastre-se</a></p>
      </footer>
    </div>
  </div>

  <script>
    const API_URL = 'https://huby.onrender.com';

    const btnToggle = document.getElementById('btnTogglePassword');
    const inputSenha = document.getElementById('loginSenha');
    const eyeOpen = document.getElementById('eyeOpenIcon');
    const eyeSlash = document.getElementById('eyeSlashIcon');

    btnToggle.addEventListener('click', () => {
      const isPassword = inputSenha.getAttribute('type') === 'password';
      inputSenha.setAttribute('type', isPassword ? 'text' : 'password');
      eyeOpen.classList.toggle('hidden', isPassword);
      eyeSlash.classList.toggle('hidden', !isPassword);
    });

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const btn = document.getElementById('btnLoginSubmit');
      
      btn.classList.add('loading');
      btn.querySelector('.btn-text').textContent = 'Autenticando...';
      btn.disabled = true;

      try {
        const response = await fetch(`${API_URL}/api/admin/verificar`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        
        const data = await response.json();

        if (data.sucesso && data.isAdmin) {
          localStorage.setItem('huby_admin_token', data.token);
          localStorage.setItem('huby_user_role', 'admin');
        } else {
          localStorage.removeItem('huby_admin_token');
          localStorage.setItem('huby_user_role', 'cliente');
        }
      } catch (err) {
        console.warn('Erro ao conectar ao servidor:', err);
        localStorage.removeItem('huby_admin_token');
        localStorage.setItem('huby_user_role', 'cliente');
      }

      localStorage.setItem('huby_ja_entrou', '1');
      localStorage.setItem('huby_cliente_email', email);
      window.location.replace('./index.html');
    });
  </script>
</body>

</html>
