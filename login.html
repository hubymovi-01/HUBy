<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Entrar - HUBy</title>
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/auth.css">
</head>
<body>

  <main class="auth-viewport">
    <div class="auth-card">
      <header class="auth-brand">
        <h1>HUB<span>y</span></h1>
        <p>Aceda à sua conta de mobilidade e entregas</p>
      </header>

      <!-- Alternador de Perfil -->
      <nav class="auth-tabs">
        <button type="button" class="auth-tab-btn active" id="tabCliente">Passageiro / Geral</button>
        <button type="button" class="auth-tab-btn" id="tabMotorista">Sou Parceiro</button>
      </nav>

      <!-- 1. Formulário Unificado: Passageiro / Administrador -->
      <form id="formLoginCliente" class="auth-form">
        <div class="input-block">
          <label for="emailCliente">E-mail</label>
          <input type="email" id="emailCliente" placeholder="exemplo@email.com" required>
        </div>

        <div class="input-block">
          <label for="senhaCliente">Palavra-passe</label>
          <input type="password" id="senhaCliente" placeholder="Introduza a sua palavra-passe" required>
        </div>

        <button type="submit" class="btn-auth-submit" id="btnEntrarCliente">Entrar</button>
      </form>

      <!-- 2. Formulário: Motorista / Cargo -->
      <form id="formLoginMotorista" class="auth-form" style="display: none;">
        <div class="input-block">
          <label for="cnhMotorista">Número da CNH</label>
          <input type="tel" id="cnhMotorista" placeholder="Apenas números da carta" required>
        </div>

        <div class="input-block">
          <label for="placaMotorista">Matrícula / Placa do Veículo</label>
          <input type="text" id="placaMotorista" placeholder="Ex: ABC1D23" style="text-transform: uppercase;" required>
        </div>

        <button type="submit" class="btn-auth-submit" id="btnEntrarMotorista" style="background: linear-gradient(135deg, #FF6B00, #C2410C); color: #FFF;">
          Aceder ao Radar de Parceiro
        </button>
      </form>

      <footer class="auth-footer">
        <span>Ainda não tem conta?</span>
        <a href="./cadastro.html">Criar registo</a>
      </footer>
    </div>
  </main>

  <script type="module" src="./js/auth.js"></script>
</body>
</html>
