<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Registar - HUBy</title>
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/auth.css">
</head>
<body>

  <main class="auth-viewport">
    <div class="auth-card">
      <header class="auth-brand">
        <h1>HUB<span>y</span></h1>
        <p>Crie a sua conta de passageiro</p>
      </header>

      <form id="formCadastroCliente" class="auth-form">
        <div class="input-block">
          <label for="cadNome">Nome Completo</label>
          <input type="text" id="cadNome" placeholder="O seu nome e apelido" required>
        </div>

        <div class="input-block">
          <label for="cadEmail">E-mail</label>
          <input type="email" id="cadEmail" placeholder="exemplo@email.com" required>
        </div>

        <div class="input-block">
          <label for="cadTelefone">Telemóvel / WhatsApp</label>
          <input type="tel" id="cadTelefone" placeholder="(00) 00000-0000" required>
        </div>

        <div class="input-block">
          <label for="cadCpf">CPF</label>
          <input type="tel" id="cadCpf" placeholder="000.000.000-00">
        </div>

        <div class="input-block">
          <label for="cadSenha">Palavra-passe</label>
          <input type="password" id="cadSenha" placeholder="Mínimo 6 carateres" minlength="6" required>
        </div>

        <button type="submit" class="btn-auth-submit" id="btnSubmeterCadastro">Criar Conta</button>
      </form>

      <footer class="auth-footer">
        <span>Já tem conta?</span>
        <a href="./login.html">Iniciar sessão</a>
      </footer>
    </div>
  </main>

  <script type="module" src="./js/auth.js"></script>
</body>
</html>
