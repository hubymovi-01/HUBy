<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Criar Conta • HUBy</title>
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/auth.css">
  <style>
    .upload-group { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .upload-box {
      border: 2px dashed rgba(16, 185, 129, 0.4);
      background: rgba(16, 185, 129, 0.05);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      color: #10B981;
      font-size: 13px;
      font-weight: 700;
    }
    .upload-box.has-file { border-style: solid; background: rgba(16, 185, 129, 0.15); color: #FFF; }
    .file-input { display: none; }
  </style>
</head>
<body class="auth-body">

  <div class="auth-ambient-glow"></div>

  <main class="auth-container">
    <div class="auth-card" style="max-height: 90vh; overflow-y: auto;">
      <header class="auth-header">
        <h1 class="auth-brand">HUB<span>y</span></h1>
        <p id="txtSubtituloCadastro" class="auth-desc">Crie a sua conta de Passageiro</p>
      </header>

      <div class="role-selector" id="roleSelectorContainer">
        <button type="button" id="btnRoleCliente" class="btn-role active">👤 Passageiro</button>
        <button type="button" id="btnRoleMotorista" class="btn-role">🚘 Motorista</button>
      </div>

      <div id="alertaCadastroBox" class="auth-alert" style="display: none;"></div>

      <form id="formCadastroHuby" class="auth-form" novalidate>
        <div class="input-group">
          <label>Nome Completo</label>
          <input type="text" id="cadNome" placeholder="Digite seu nome completo" required>
        </div>

        <div class="input-group">
          <label>E-mail</label>
          <input type="email" id="cadEmail" placeholder="seu@email.com" required>
        </div>

        <div class="input-group">
          <label>Telemóvel / WhatsApp</label>
          <input type="tel" id="cadTelefone" placeholder="(00) 00000-0000" maxlength="15" required>
        </div>

        <div class="input-group">
          <label>CPF</label>
          <input type="text" id="cadCPF" placeholder="000.000.000-00" maxlength="14" required>
        </div>

        <div class="input-group">
          <label>Palavra-passe</label>
          <input type="password" id="cadSenha" placeholder="••••••••" required>
        </div>

        <!-- CAMPOS EXCLUSIVOS MOTORISTA -->
        <div id="blocoMotorista" style="display: none; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 16px; margin-top: 16px;">
          <h4 style="margin-bottom: 12px; color: #10B981; font-size: 14px; text-transform: uppercase;">🚘 Dados do Veículo e CNH</h4>
          
          <div class="input-group">
            <label>Nº da CNH (11 dígitos)</label>
            <input type="tel" id="cadCNH" placeholder="Digite os 11 dígitos da CNH" maxlength="11">
          </div>

          <div class="input-group">
            <label>Categoria do Veículo</label>
            <select id="cadCategoriaVeiculo" style="width: 100%; padding: 12px; background: #090D16; border: 1px solid rgba(255,255,255,0.08); color: #FFF; border-radius: 10px;">
              <option value="carro">Carro Padrão</option>
              <option value="moto">Moto Passageiro</option>
              <option value="flash_moto">Flash (Entregas)</option>
              <option value="cargo_pickup">Frete / Picape</option>
            </select>
          </div>

          <div class="input-group">
            <label>Modelo do Veículo</label>
            <input type="text" id="cadModelo" placeholder="Ex: Chevrolet Onix 1.0 / Honda CG 160">
          </div>

          <div style="display: flex; gap: 8px;">
            <div class="input-group" style="flex: 1.2;">
              <label>Placa Mercosul</label>
              <input type="text" id="cadPlaca" placeholder="ABC1D23" style="text-transform: uppercase;" maxlength="7">
            </div>
            <div class="input-group" style="flex: 1;">
              <label>Cor</label>
              <input type="text" id="cadCor" placeholder="Ex: Prata">
            </div>
            <div class="input-group" style="flex: 0.9;">
              <label>Ano</label>
              <input type="number" id="cadAno" placeholder="2022" min="1990" max="2027">
            </div>
          </div>

          <div class="upload-group">
            <label>Fotografia da CNH</label>
            <label class="upload-box" id="boxCNH">
              📸 Tocar para fotografar a CNH
              <input type="file" id="fileCNH" class="file-input" accept="image/*" capture="environment">
            </label>
          </div>

          <div class="upload-group">
            <label>Fotografia do CRLV (Documento do Carro)</label>
            <label class="upload-box" id="boxCRLV">
              📸 Tocar para fotografar o CRLV
              <input type="file" id="fileCRLV" class="file-input" accept="image/*" capture="environment">
            </label>
          </div>
        </div>

        <button type="submit" id="btnSubmeterCadastro" class="btn-primary-action" style="margin-top: 20px;">
          <span>Criar Conta</span>
        </button>
      </form>

      <footer class="auth-footer-nav" style="margin-top: 20px;">
        <span>Já tem conta?</span>
        <a href="./login.html">Iniciar sessão</a>
      </footer>
    </div>
  </main>

  <script type="module">
    import { API_URL } from './js/config.js';

    let roleAtual = 'cliente';
    let cnhBase64 = null;
    let crlvBase64 = null;

    const urlParams = new URLSearchParams(window.location.search);
    const perfilParam = urlParams.get('perfil');

    const btnCliente = document.getElementById('btnRoleCliente');
    const btnMotorista = document.getElementById('btnRoleMotorista');
    const blocoMot = document.getElementById('blocoMotorista');
    const subtitulo = document.getElementById('txtSubtituloCadastro');
    const alertaBox = document.getElementById('alertaCadastroBox');

    function alternarPerfil(role) {
      roleAtual = role;
      if (role === 'motorista') {
        btnMotorista.classList.add('active');
        btnCliente.classList.remove('active');
        blocoMot.style.display = 'block';
        subtitulo.textContent = 'Crie a sua conta de Motorista Parceiro';
      } else {
        btnCliente.classList.add('active');
        btnMotorista.classList.remove('active');
        blocoMot.style.display = 'none';
        subtitulo.textContent = 'Crie a sua conta de Passageiro';
      }
      esconderAlerta();
    }

    if (perfilParam === 'motorista') alternarPerfil('motorista');
    btnCliente.addEventListener('click', () => alternarPerfil('cliente'));
    btnMotorista.addEventListener('click', () => alternarPerfil('motorista'));

    // MÁSCARA CPF
    const inputCpf = document.getElementById('cadCPF');
    inputCpf.addEventListener('input', (e) => {
      let v = e.target.value.replace(/\D/g, '');
      if (v.length > 11) v = v.slice(0, 11);
      
      if (v.length > 9) {
        v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
      } else if (v.length > 6) {
        v = v.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
      } else if (v.length > 3) {
        v = v.replace(/(\d{3})(\d{1,3})/, '$1.$2');
      }
      e.target.value = v;
    });

    const inputTel = document.getElementById('cadTelefone');
    inputTel.addEventListener('input', (e) => {
      let v = e.target.value.replace(/\D/g, '');
      if (v.length > 11) v = v.slice(0, 11);
      v = v.replace(/^(\d{2})(\d)/g, '($1) $2');
      v = v.replace(/(\d{5})(\d{4})$/, '$1-$2');
      e.target.value = v;
    });

    function processarUpload(inputId, boxId, callback) {
      const input = document.getElementById(inputId);
      const box = document.getElementById(boxId);
      input.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 900;
            const MAX_HEIGHT = 900;
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > MAX_WIDTH) {
                height *= MAX_WIDTH / width;
                width = MAX_WIDTH;
              }
            } else {
              if (height > MAX_HEIGHT) {
                width *= MAX_HEIGHT / height;
                height = MAX_HEIGHT;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const base64Comprimido = canvas.toDataURL('image/jpeg', 0.82);
            callback(base64Comprimido);
            box.classList.add('has-file');
            box.innerHTML = '✅ Fotografia guardada com sucesso!';
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    processarUpload('fileCNH', 'boxCNH', (b64) => cnhBase64 = b64);
    processarUpload('fileCRLV', 'boxCRLV', (b64) => crlvBase64 = b64);

    document.getElementById('formCadastroHuby').addEventListener('submit', async (e) => {
      e.preventDefault();
      esconderAlerta();
      
      const payload = {
        nome: document.getElementById('cadNome').value.trim(),
        email: document.getElementById('cadEmail').value.trim(),
        telefone: inputTel.value.replace(/\D/g, ''),
        cpf: inputCpf.value.replace(/\D/g, ''),
        senha: document.getElementById('cadSenha').value,
        role: roleAtual
      };

      if (!payload.nome || !payload.email || !payload.telefone || !payload.cpf || !payload.senha) {
        exibirAlerta('Por favor, preencha todos os campos obrigatórios.', 'error');
        return;
      }

      if (roleAtual === 'motorista') {
        payload.cnh = document.getElementById('cadCNH').value.replace(/\D/g, '');
        payload.cnh_numero = payload.cnh;
        payload.categoria_veiculo = document.getElementById('cadCategoriaVeiculo').value;
        payload.categoria = payload.categoria_veiculo;
        payload.veiculo_modelo = document.getElementById('cadModelo').value.trim();
        payload.veiculo_placa = document.getElementById('cadPlaca').value.trim().toUpperCase();
        payload.veiculo_cor = document.getElementById('cadCor').value.trim();
        payload.veiculo_ano = document.getElementById('cadAno').value.trim();

        payload.doc_cnh_url = cnhBase64 || 'data:image/png;base64,mock';
        payload.doc_crlv_url = crlvBase64 || 'data:image/png;base64,mock';

        if (!payload.cnh || !payload.veiculo_modelo || !payload.veiculo_placa) {
          exibirAlerta('Preencha os dados da CNH, Modelo e Placa do veículo.', 'error');
          return;
        }
      }

      const btnSub = document.getElementById('btnSubmeterCadastro');
      const spanBtn = btnSub.querySelector('span');

      try {
        btnSub.disabled = true;
        if (spanBtn) spanBtn.textContent = 'A criar conta...';

        const resp = await fetch(`${API_URL}/api/usuarios/cadastro`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        
        const data = await resp.json();
        
        if (resp.status === 409 || !resp.ok) {
          throw new Error(data.erro || 'Este e-mail ou CPF já está registado.');
        }

        localStorage.setItem('huby_token', data.token);
        localStorage.setItem('huby_user_role', data.usuario.role);
        localStorage.setItem('huby_user_name', data.usuario.nome);
        
        exibirAlerta('Conta criada com sucesso!', 'success');
        setTimeout(() => {
          window.location.replace(roleAtual === 'motorista' ? './motorista.html' : './index.html');
        }, 800);

      } catch (err) {
        console.error("Erro no cadastro:", err);
        let msgErro = err.message;
        if (msgErro.includes('already exists') || msgErro.includes('conflito') || msgErro.includes('409')) {
          msgErro = 'Este e-mail ou CPF já possui cadastro. <a href="./login.html" style="color: #38BDF8; font-weight: 800;">Clique aqui para fazer login</a>';
        }
        exibirAlertaHtml(msgErro, 'error');
        btnSub.disabled = false;
        if (spanBtn) spanBtn.textContent = 'Criar Conta';
      }
    });

    function exibirAlerta(msg, tipo) {
      if (!alertaBox) return;
      alertaBox.textContent = msg;
      alertaBox.className = `auth-alert ${tipo}`;
      alertaBox.style.display = 'block';
      alertaBox.style.background = tipo === 'error' ? 'rgba(239, 68, 68, 0.15)' : 'rgba(16, 185, 129, 0.15)';
      alertaBox.style.border = `1px solid ${tipo === 'error' ? 'rgba(239, 68, 68, 0.3)' : 'rgba(16, 185, 129, 0.3)'}`;
      alertaBox.style.color = tipo === 'error' ? '#F87171' : '#10B981';
    }

    function exibirAlertaHtml(html, tipo) {
      if (!alertaBox) return;
      alertaBox.innerHTML = html;
      alertaBox.className = `auth-alert ${tipo}`;
      alertaBox.style.display = 'block';
      alertaBox.style.background = 'rgba(239, 68, 68, 0.15)';
      alertaBox.style.border = '1px solid rgba(239, 68, 68, 0.3)';
      alertaBox.style.color = '#F87171';
    }

    function esconderAlerta() {
      if (!alertaBox) return;
      alertaBox.style.display = 'none';
    }
  </script>
</body>
</html>
