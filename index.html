<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>HUBy 2.0</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/cliente.css">
</head>
<body class="client-viewport">

  <!-- 1. MAPA DE FUNDO -->
  <div id="mapaCliente"></div>

  <!-- 2. BARRA DE TOPO FLUTUANTE -->
  <header class="top-nav-bar">
    <div class="brand-pill">
      <span class="hub-txt">HUB</span><span class="y-txt">y</span>
    </div>
    <div class="nav-actions">
      <button type="button" id="btnAbrirHistorico" class="btn-action-pill" aria-label="Histórico">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        <span>Viagens</span>
      </button>
    </div>
  </header>

  <!-- 3. BOTÃO GPS FLUTUANTE (Posicionado sobre o mapa acima do dock) -->
  <button type="button" id="btnLocalizarGPS" class="btn-floating-gps" aria-label="Recentralizar GPS">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7"></circle><line x1="12" y1="1" x2="12" y2="5"></line><line x1="12" y1="19" x2="12" y2="23"></line><line x1="5" y1="12" x2="1" y2="12"></line><line x1="23" y1="12" x2="19" y2="12"></line></svg>
  </button>

  <!-- 4. DOCK INFERIOR PREMIUM -->
  <section class="client-dock-sheet">
    <div class="sheet-drag-handle"></div>

    <!-- Seletor de Categorias Estilizado -->
    <div class="category-slider">
      <button type="button" class="category-chip active" data-id="carro">
        <span class="cat-icon">🚗</span>
        <span class="cat-label">Carro</span>
      </button>
      <button type="button" class="category-chip" data-id="moto">
        <span class="cat-icon">🏍️</span>
        <span class="cat-label">Moto</span>
      </button>
      <button type="button" class="category-chip" data-id="flash_moto">
        <span class="cat-icon">⚡</span>
        <span class="cat-label">Flash</span>
      </button>
      <button type="button" class="category-chip" data-id="cargo_pickup">
        <span class="cat-icon">📦</span>
        <span class="cat-label">Frete</span>
      </button>
    </div>

    <!-- Bloco de Resumo da Viagem -->
    <div id="blocoResumo" class="trip-summary-card">
      <div class="route-details">
        <div class="route-point-indicator"></div>
        <div class="route-texts">
          <span class="route-title">Destino</span>
          <span id="txtDestinoSelecionado" class="route-subtitle">Toque no mapa para indicar o destino</span>
        </div>
      </div>
      <div class="trip-price-block">
        <span id="txtPrecoEstimado" class="price-val">R$ 10,00</span>
        <span id="txtDistanciaEstimada" class="eta-val">-- km</span>
      </div>
    </div>

    <!-- Card de Corrida em Andamento (Oculto Inicialmente) -->
    <div id="cardStatusViagem" class="active-ride-card" style="display: none;">
      <div class="ride-header">
        <div class="pulse-radar"></div>
        <h4 id="statusTitulo">Radar Ativo: Procurando motorista...</h4>
      </div>
      <p id="statusDescricao">O seu pedido foi enviado para os parceiros próximos.</p>
    </div>

    <!-- Botão Principal de Ação -->
    <button type="button" id="btnPedirHuby" class="btn-main-action">
      Chamar HUBy Carro
    </button>
  </section>

  <!-- Modal de Avaliação Opcional -->
  <div id="modalAvaliacao" class="modal-backdrop" style="display: none;">
    <div class="modal-card">
      <h3>Como correu a sua viagem?</h3>
      <p>Classifique o atendimento do condutor parceiro:</p>
      
      <div id="estrelasRating" class="star-rating">
        <span data-val="1">★</span><span data-val="2">★</span><span data-val="3">★</span><span data-val="4">★</span><span data-val="5">★</span>
      </div>

      <textarea id="txtComentarioAvaliacao" placeholder="Deixe um elogio ou observação (opcional)..."></textarea>
      
      <div class="modal-btn-row">
        <button type="button" id="btnPularAvaliacao" class="btn-secondary-modal">Pular</button>
        <button type="button" id="btnEnviarAvaliacao" class="btn-primary-modal">Enviar</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="./js/app-cliente.js"></script>
</body>
</html>
