<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>HUBy</title>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0B0F19">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="./css/base.css?v=2.2.0">
  <link rel="stylesheet" href="./css/cliente.css?v=2.2.0">

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    #hubySplash { animation: encerrarSplashHUBy 0.4s ease 1.2s forwards !important; }
    @keyframes encerrarSplashHUBy {
      0% { opacity: 1; visibility: visible; pointer-events: all; }
      99% { opacity: 0; visibility: hidden; pointer-events: none; }
      100% { opacity: 0; visibility: hidden; display: none !important; pointer-events: none; }
    }

    /* BOTÃO FLUTUANTE DO GPS (SOZINHO E AJUSTADO) */
    .btn-floating-gps {
      position: absolute;
      bottom: 240px; 
      right: 18px;
      width: 48px;
      height: 48px;
      background: rgba(17, 24, 39, 0.9);
      border: 2px solid rgba(16, 185, 129, 0.8);
      border-radius: 50%;
      color: #10B981;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
      z-index: 9999;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    #mapaCliente {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%; height: 100vh !important;
      z-index: 10; 
    }
  </style>
</head>
<body class="client-viewport">

  <div id="hubySplash" class="splash-screen" onclick="this.style.display='none'">
    <div class="splash-content">
      <div class="splash-logo"><span class="s-hub">HUB</span><span class="s-y">y</span></div>
      <div class="splash-spinner"></div>
    </div>
  </div>

  <div id="mapaCliente"></div>

  <header class="top-nav-bar">
    <button type="button" id="btnAbrirMenu" class="btn-menu-burger"><span></span><span></span><span></span></button>
    <div class="brand-pill"><span class="hub-txt">HUB</span><span class="y-txt">y</span></div>
    <button type="button" id="btnNavViagens" class="btn-action-pill"><span>Viagens</span></button>
  </header>

  <div id="menuBackdrop" class="drawer-backdrop"></div>
  <aside id="drawerMenu" class="drawer-panel">
    <div class="drawer-profile" id="drawerPerfilBox"></div>
    <nav class="drawer-nav">
      <a href="#" id="menuItemViagens" class="drawer-item"><span class="d-icon">📋</span><div class="d-info"><strong>Minhas Viagens</strong></div></a>
      <a href="#" id="menuItemPagamentos" class="drawer-item"><span class="d-icon">💳</span><div class="d-info"><strong>Formas de Pagamento</strong></div></a>
      <a href="#" id="menuItemSeguranca" class="drawer-item"><span class="d-icon">🛡️</span><div class="d-info"><strong>Contato de Segurança</strong></div></a>
      <a href="./motorista.html" class="drawer-item highlight-driver"><span class="d-icon">🚘</span><div class="d-info"><strong>Painel do Motorista</strong></div></a>
    </nav>
    <div class="drawer-footer">
      <button type="button" id="btnAcaoConta" class="btn-drawer-auth">Entrar ou Cadastrar</button>
    </div>
  </aside>

  <!-- BOTÃO GPS ISOLADO (O botão SOS foi removido daqui) -->
  <button type="button" id="btnLocalizarGPS" class="btn-floating-gps">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="7"></circle>
      <line x1="12" y1="1" x2="12" y2="5"></line>
      <line x1="12" y1="19" x2="12" y2="23"></line>
      <line x1="5" y1="12" x2="1" y2="12"></line>
      <line x1="23" y1="12" x2="19" y2="12"></line>
    </svg>
  </button>

  <section class="client-dock-sheet" style="z-index: 50;">
    <div class="sheet-drag-handle"></div>
    <div class="category-slider">
      <button type="button" class="category-chip active" data-id="carro"><span class="cat-icon">🚗</span><span class="cat-label">Carro</span></button>
      <button type="button" class="category-chip" data-id="moto"><span class="cat-icon">🏍️</span><span class="cat-label">Moto</span></button>
    </div>
    <div id="blocoResumo" class="trip-summary-card">
      <div class="route-details">
        <div class="route-texts">
          <span class="route-title">Destino</span>
          <span id="txtDestinoSelecionado" class="route-subtitle">Toque no mapa para indicar o destino</span>
        </div>
      </div>
      <div class="trip-price-block">
        <span id="txtPrecoEstimado" class="price-val">R$ 10,00</span>
        <span id="txtDistanciaEstimada" class="eta-val">-- km</span>
      </div>
    </div>
    <button type="button" id="btnPedirHuby" class="btn-main-action">Chamar HUBy Carro</button>
  </section>

  <!-- MODAL DE SEGURANÇA MANTIDO, MAS OCULTO -->
  <div id="modalSeguranca" class="modal-backdrop" style="display: none; z-index: 10000;">
    <div class="modal-card">
      <div class="modal-header-row">
        <h3>Segurança na Viagem</h3><button type="button" id="btnFecharSeguranca" class="btn-icon-close">✕</button>
      </div>
      <button type="button" id="btnCompartilharRotaZap" class="btn-primary-modal" style="width: 100%;">📲 Compartilhar Rota</button>
    </div>
  </div>

  <script type="module" src="./js/app-cliente.js?v=2.2.0"></script>
  <script type="module">
    const modalSeg = document.getElementById('modalSeguranca');
    document.getElementById('menuItemSeguranca')?.addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('menuBackdrop')?.click();
      if (modalSeg) modalSeg.style.display = 'flex';
    });
    document.getElementById('btnFecharSeguranca')?.addEventListener('click', () => {
      if (modalSeg) modalSeg.style.display = 'none';
    });
  </script>
</body>
</html>
