<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>HUBy - Meu Perfil</title>
  <style>
    :root {
      --bg-dark: #090D16;
      --card-dark: #121826;
      --border-dark: rgba(255, 255, 255, 0.08);
      --emerald: #10B981;
      --blue: #38BDF8;
      --text-pri: #F8FAFC;
      --text-sec: #94A3B8;
    }

    * { box-sizing: border-box; }

    body {
      background: var(--bg-dark);
      color: var(--text-pri);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; 
      padding: 0;
      padding-bottom: 40px;
    }

    /* Cabeçalho Premium */
    .header-perfil {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 24px; background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 10;
      border-bottom: 1px solid var(--border-dark);
    }

    .btn-voltar {
      background: rgba(255,255,255,0.05); border: 1px solid var(--border-dark);
      color: #FFF; width: 40px; height: 40px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .btn-voltar:active { transform: scale(0.9); }

    /* Showcase do Perfil (Avatar + Info) */
    .profile-showcase {
      text-align: center;
      padding: 40px 20px 30px;
      background: linear-gradient(180deg, rgba(56, 189, 248, 0.05) 0%, var(--bg-dark) 100%);
    }

    .avatar-wrapper {
      position: relative; width: 120px; height: 120px; margin: 0 auto 16px auto;
    }

    .avatar-circle {
      width: 100%; height: 100%; background: var(--card-dark);
      border-radius: 50%; border: 4px solid var(--card-dark);
      box-shadow: 0 0 0 2px var(--blue), 0 10px 24px rgba(0,0,0,0.5);
      overflow: hidden; display: flex; align-items: center; justify-content: center; 
      font-size: 48px; color: var(--blue); font-weight: 900;
    }

    .avatar-circle img { width: 100%; height: 100%; object-fit: cover; }

    .btn-edit-avatar {
      position: absolute; bottom: 0; right: 0; background: var(--blue); color: #000; 
      border: 4px solid var(--bg-dark); width: 40px; height: 40px; border-radius: 50%; 
      font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: transform 0.2s;
    }

    .btn-edit-avatar:active { transform: scale(0.9); }

    .showcase-name { margin: 0 0 6px; font-size: 24px; font-weight: 900; letter-spacing: -0.5px; }
    .showcase-contact { margin: 0; font-size: 13px; color: var(--text-sec); font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;}
    
    .badge-verificado {
      background: rgba(16, 185, 129, 0.15); color: var(--emerald);
      padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 800; text-transform: uppercase;
    }

    /* Secção de Edição */
    .profile-section {
      padding: 0 24px;
      margin-bottom: 30px;
    }

    .section-title {
      font-size: 12px; color: var(--text-sec); font-weight: 800; text-transform: uppercase;
      letter-spacing: 1px; margin-bottom: 16px; display: block;
    }

    .form-group {
      background: var(--card-dark); border: 1px solid var(--border-dark);
      border-radius: 16px; padding: 8px 16px; display: flex; flex-direction: column;
      margin-bottom: 16px;
    }

    .form-group label { font-size: 10px; color: var(--blue); font-weight: 800; text-transform: uppercase; margin-bottom: 4px; margin-top: 6px; }
    .form-group input { 
      width: 100%; background: transparent; border: none; color: #FFF; 
      font-size: 16px; font-weight: 700; padding: 6px 0 10px 0; outline: none; 
    }

    .btn-salvar { 
      background: var(--emerald); color: #032017; border: none; width: 100%; 
      padding: 16px; border-radius: 14px; font-size: 15px; font-weight: 900; 
      cursor: pointer; box-shadow: 0 8px 20px rgba(16, 185, 129, 0.2); transition: all 0.2s;
    }
    .btn-salvar:active { transform: translateY(2px); box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2); }

    /* Menu de Ações */
    .action-menu {
      background: var(--card-dark); border: 1px solid var(--border-dark);
      border-radius: 16px; overflow: hidden;
    }

    .action-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 16px; background: transparent; border: none; border-bottom: 1px solid var(--border-dark);
      width: 100%; color: #FFF; font-size: 15px; font-weight: 700; cursor: pointer; text-align: left;
    }
    .action-item:last-child { border-bottom: none; }
    .action-item:active { background: rgba(255,255,255,0.02); }
    
    .action-left { display: flex; align-items: center; gap: 14px; }
    .action-icon { 
      width: 32px; height: 32px; background: rgba(255,255,255,0.05); 
      border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px;
    }
    .action-arrow { color: var(--text-sec); font-weight: 900; }

    .btn-logout { color: #EF4444; }
    .btn-logout .action-icon { background: rgba(239, 68, 68, 0.1); }
  </style>
</head>
<body>

  <div class="header-perfil">
    <button class="btn-voltar" onclick="history.back()">←</button>
    <h3 style="margin:0; font-size: 16px; font-weight: 800;">A Minha Conta</h3>
    <div style="width: 40px;"></div>
  </div>

  <div class="profile-showcase">
    <div class="avatar-wrapper">
      <div class="avatar-circle" id="avatarDisplay">U</div>
      <button class="btn-edit-avatar" onclick="document.getElementById('inputFoto').click()">📷</button>
      <input type="file" id="inputFoto" accept="image/*" style="display: none;">
    </div>
    <h2 class="showcase-name" id="displayNome">Carregando...</h2>
    <p class="showcase-contact">
      <span id="displayContato">---</span>
      <span class="badge-verificado">✓ Verificado</span>
    </p>
  </div>

  <div class="profile-section">
    <span class="section-title">Dados Principais</span>
    <div class="form-group">
      <label>Nome de Exibição</label>
      <input type="text" id="perfilNome" placeholder="Como quer ser chamado?">
    </div>
    <button type="button" class="btn-salvar" id="btnSalvarPerfil">Guardar Alterações</button>
  </div>

  <div class="profile-section">
    <span class="section-title">Definições da Conta</span>
    <div class="action-menu">
      <button class="action-item" onclick="alert('Funcionalidade em desenvolvimento!')">
        <div class="action-left"><div class="action-icon">📍</div> Locais Guardados</div>
        <div class="action-arrow">›</div>
      </button>
      <button class="action-item" onclick="alert('Funcionalidade em desenvolvimento!')">
        <div class="action-left"><div class="action-icon">🛡️</div> Segurança e Privacidade</div>
        <div class="action-arrow">›</div>
      </button>
      <button class="action-item btn-logout" onclick="fazerLogout()">
        <div class="action-left"><div class="action-icon">🚪</div> Terminar Sessão</div>
      </button>
    </div>
  </div>

  <script type="module">
    import { API_URL } from './js/config.js';
    
    let fotoBase64 = null;
    let dadosAtuais = {}; 
    
    const token = localStorage.getItem('huby_token');
    if(!token) window.location.href = './login.html';

    // 1. Carregar dados com sistema de segurança anti-falha
    async function carregarDados() {
      try {
        const resp = await fetch(`${API_URL}/api/auth/perfil`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const dados = await resp.json();
        if(dados.erro) throw new Error(dados.erro);

        dadosAtuais = dados; 

        document.getElementById('perfilNome').value = dados.nome || '';
        document.getElementById('displayNome').textContent = dados.nome || 'Utilizador';
        document.getElementById('displayContato').textContent = dados.telefone || dados.email || 'Conta verificada';

        if(dados.foto_url) {
          fotoBase64 = dados.foto_url;
          document.getElementById('avatarDisplay').innerHTML = `<img src="${dados.foto_url}" />`;
        } else {
          document.getElementById('avatarDisplay').textContent = dados.nome.charAt(0).toUpperCase();
        }
      } catch(err) {
        console.warn('Erro na base de dados, a usar memória local para não bloquear o ecrã:', err);
        const nomeLocal = localStorage.getItem('huby_user_name') || 'Utilizador HUBy';
        document.getElementById('displayNome').textContent = nomeLocal;
        document.getElementById('perfilNome').value = nomeLocal;
        document.getElementById('displayContato').textContent = 'Conta verificada';
        document.getElementById('avatarDisplay').textContent = nomeLocal.charAt(0).toUpperCase();
      }
    }

    // 2. Compressor de Imagem Profissional (Reduz 5MB para 50KB)
    document.getElementById('inputFoto').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if(!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const tamanhoMaximo = 400; // Tamanho ideal para fotos de perfil
          let largura = img.width;
          let altura = img.height;

          if (largura > altura) {
            if (largura > tamanhoMaximo) {
              altura *= tamanhoMaximo / largura;
              largura = tamanhoMaximo;
            }
          } else {
            if (altura > tamanhoMaximo) {
              largura *= tamanhoMaximo / altura;
              altura = tamanhoMaximo;
            }
          }

          canvas.width = largura;
          canvas.height = altura;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, largura, altura);

          fotoBase64 = canvas.toDataURL('image/jpeg', 0.7); // 70% de qualidade
          document.getElementById('avatarDisplay').innerHTML = `<img src="${fotoBase64}" />`;
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // 3. Guardar no Backend
    document.getElementById('btnSalvarPerfil').addEventListener('click', async () => {
      const btn = document.getElementById('btnSalvarPerfil');
      btn.textContent = 'A guardar...';
      btn.disabled = true;

      const novoNome = document.getElementById('perfilNome').value;

      const payload = {
        nome: novoNome,
        email: dadosAtuais.email || null,       
        telefone: dadosAtuais.telefone || null, 
        foto_url: fotoBase64
      };

      try {
        const resp = await fetch(`${API_URL}/api/auth/perfil`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(payload)
        });

        const resData = await resp.json();
        if(!resp.ok) throw new Error(resData.erro);

        document.getElementById('displayNome').textContent = novoNome;
        localStorage.setItem('huby_user_name', novoNome);
        if(fotoBase64) localStorage.setItem('huby_user_foto', fotoBase64);

        alert('Perfil atualizado com sucesso!');
      } catch(err) {
        alert('Erro ao guardar: ' + err.message);
      } finally {
        btn.textContent = 'Guardar Alterações';
        btn.disabled = false;
      }
    });

    window.fazerLogout = function() {
      if(confirm('Tem a certeza que deseja terminar sessão?')) {
        localStorage.clear();
        window.location.replace('./login.html');
      }
    }

    carregarDados();
  </script>
</body>
</html>
