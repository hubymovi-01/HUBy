<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUBy - Painel Administrativo</title>
  <link rel="stylesheet" href="./css/base.css">
  <style>
    body { background: #0B0F19; color: #FFF; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 24px; }
    .admin-container { max-width: 1100px; margin: 0 auto; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 30px; }
    .card-metric { background: #151C2C; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 20px; }
    .card-metric small { color: #8F9CAE; font-size: 12px; text-transform: uppercase; font-weight: 700; }
    .card-metric h2 { font-size: 24px; margin: 8px 0 0; color: #10B981; }
    .table-card { background: #151C2C; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 20px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    th { color: #8F9CAE; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .badge-concluido { background: rgba(16,185,129,0.15); color: #10B981; }
    .badge-pendente { background: rgba(245,158,11,0.15); color: #F59E0B; }
    .badge-cancelado { background: rgba(239,68,68,0.15); color: #EF4444; }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="header-bar">
      <h2>Painel Executivo HUBy 2.0</h2>
      <button onclick="window.location.reload()" style="background:#10B981; color:#03251E; border:none; padding:8px 16px; border-radius:8px; font-weight:700; cursor:pointer;">Atualizar Dados</button>
    </div>

    <div class="metrics-grid">
      <div class="card-metric">
        <small>Faturação Bruta</small>
        <h2 id="mFaturamentoBruto">R$ 0,00</h2>
      </div>
      <div class="card-metric">
        <small>Receita HUBy (15%)</small>
        <h2 id="mReceitaHuby" style="color: #60A5FA;">R$ 0,00</h2>
      </div>
      <div class="card-metric">
        <small>Repasse Parceiros (85%)</small>
        <h2 id="mRepasseMotoristas">R$ 0,00</h2>
      </div>
      <div class="card-metric">
        <small>Chamadas no Radar</small>
        <h2 id="mChamadasAbertas" style="color: #F59E0B;">0</h2>
      </div>
    </div>

    <div class="table-card">
      <h3 style="margin-top:0; margin-bottom:16px;">Monitor de Viagens Recentes</h3>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Categoria</th>
            <th>Distância</th>
            <th>Valor Bruto</th>
            <th>Motorista</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="corpoTabelaChamadas">
          <tr><td colspan="6">A carregar métricas...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module" src="./js/admin.js"></script>
</body>
</html>
