<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HUBy Admin - Gestão de Frotas e Comissões</title>
  <style>
    :root {
      --bg-deep: #090D16; --bg-card: #0F172A; --bg-surface: #1E293B; --border-color: #334155;
      --huby-emerald: #10B981; --huby-flash: #38BDF8; --huby-cargo: #FF6B00;
      --text-white: #FFFFFF; --text-light: #E2E8F0; --text-muted: #94A3B8; --danger: #EF4444; --radius-md: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-deep); color: var(--text-white); min-height: 100vh; display: flex; flex-direction: column; }
    .admin-layout { display: flex; flex-direction: column; height: 100vh; max-width: 480px; margin: 0 auto; width: 100%; background-color: var(--bg-deep); position: relative; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
    .huby-header { background-color: var(--bg-deep); padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--bg-surface); }
    .brand-logo { display: inline-flex; align-items: center; gap: 4px; text-decoration: none; }
    .brand-hub { font-size: 26px; font-weight: 900; color: var(--text-white); letter-spacing: -1px; }
    .brand-y-badge { background-color: var(--huby-cargo); color: var(--bg-deep); font-size: 19px; font-weight: 900; font-style: italic; padding: 1px 8px 3px; border-radius: 8px; position: relative; }
    .badge-pill { font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: 20px; background-color: var(--bg-surface); color: var(--text-light); text-decoration: none; }
    
    .admin-main { flex: 1; background: #111827; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
    .card-box { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 16px; }
    .card-title { font-size: 14px; font-weight: 800; color: var(--huby-cargo); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    
    .financial-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .fin-box { background: var(--bg-surface); padding: 10px 6px; border-radius: 10px; text-align: center; }
    .fin-val { font-size: 14px; font-weight: 900; color: var(--huby-emerald); margin-top: 4px; }
    
    .driver-row { display: flex; justify-content: space-between; align-items: center; background: var(--bg-surface); padding: 10px; border-radius: 10px; margin-bottom: 8px; font-size: 12px; }
    .btn-approve { background: var(--huby-emerald); color: var(--bg-deep); border: none; padding: 6px 12px; border-radius: 6px; font-weight: 900; cursor: pointer; }
    .btn-block { background: var(--danger); color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 900; cursor: pointer; }
  </style>
</head>
<body>

  <div class="admin-layout">
    <header class="huby-header">
      <a href="./admin.html" class="brand-logo">
        <span class="brand-hub">HUB</span>
        <span class="brand-y-badge">y</span>
      </a>
      <a href="./index.html" class="badge-pill">⬅ Voltar ao App</a>
    </header>

    <main class="admin-main">
      <div class="card-box">
        <div class="card-title">📊 Faturamento & Comissões (Hoje)</div>
        <div class="financial-grid">
          <div class="fin-box">
            <div style="font-size:10px; color:var(--text-muted);">Corridas</div>
            <div class="fin-val">128</div>
          </div>
          <div class="fin-box">
            <div style="font-size:10px; color:var(--text-muted);">Bruto</div>
            <div class="fin-val">R$ 4.620</div>
          </div>
          <div class="fin-box">
            <div style="font-size:10px; color:var(--text-muted);">Comissão (15%)</div>
            <div class="fin-val" style="color:var(--huby-cargo);">R$ 693</div>
          </div>
        </div>
      </div>

      <div class="card-box">
        <div class="card-title">👥 Aprovação de Motoristas & Frotas</div>
        <div id="listaAprovacao">
          <div class="driver-row" id="cad1">
            <div>
              <strong>Carlos Eduardo</strong><br>
              <span style="color:var(--text-muted);">HUBy Cargo (Caminhão VUC)</span>
            </div>
            <button type="button" class="btn-approve" onclick="aprovarMotorista('cad1')">Aprovar</button>
          </div>
          <div class="driver-row" id="cad2">
            <div>
              <strong>Mariana Souza</strong><br>
              <span style="color:var(--text-muted);">HUBy Moto (Entregas Flash)</span>
            </div>
            <button type="button" class="btn-approve" onclick="aprovarMotorista('cad2')">Aprovar</button>
          </div>
        </div>
      </div>

      <div class="card-box">
        <div class="card-title">⚙️ Controlo de Inadimplência</div>
        <div class="driver-row">
          <div>
            <strong>Roberto F. (Moto)</strong><br>
            <span style="color:var(--danger);">Dívida de comissão: R$ 58,00</span>
          </div>
          <button type="button" class="btn-block">Bloquear</button>
        </div>
      </div>
    </main>
  </div>

  <script>
    function aprovarMotorista(id) {
      const el = document.getElementById(id);
      el.style.opacity = '0.5';
      el.querySelector('button').innerText = 'Aprovado ✔';
      el.querySelector('button').style.background = '#38BDF8';
      alert('Parceiro verificado e liberado para operar na frota HUBy!');
    }
  </script>
</body>
</html>
