<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>HUBy Motorista - Radar em Tempo Real</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#080C14">

  <!-- GUARDA DE PERFIL: Valida se é motorista e redireciona se for de outra modalidade -->
  <script>
    (function () {
      const papel = localStorage.getItem('huby_user_role');
      const categoria = localStorage.getItem('huby_parceiro_categoria');

      if (papel !== 'motorista') {
        window.location.replace('./cadastro-motorista.html');
        return;
      }

      // Redireciona para o painel dedicado se for Moto ou Cargo
      if (categoria === 'moto' || categoria === 'flash') {
        window.location.replace('./painel-motoboy.html');
      } else if (categoria === 'cargo') {
        window.location.replace('./painel-cargo.html');
      }
    })();
  </script>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- CSS Exclusivo do Motorista -->
  <link rel="stylesheet" href="./css/motorista.css">
</head>

<body>
  <div class="driver-layout">

    <!-- CABEÇALHO UNIFICADO E DINÂMICO -->
    <header class="driver-header">
      <div class="header-left">
        <div class="driver-avatar" id="lblAvatarMotorista">TC</div>
        <div class="driver-meta">
          <div class="meta-row">
            <span class="d-name" id="lblNomeMotorista">Motorista</span>
            <span class="d-badge">⭐ 5.0</span>
          </div>
          <span class="d-earnings" id="statGanhosHoje">Hoje: <strong>R$ 0,00</strong> (0 corridas)</span>
        </div>
      </div>

      <div class="header-right">
        <button type="button" id="btnToggleStatus" class="btn-toggle-online status-online">
          <span class="pulse-indicator"></span>
          <span id="txtStatusMotorista">ONLINE</span>
        </button>
        <!-- Botão para encerrar a sessão de motorista -->
        <button type="button" class="btn-mode-icon" id="btnSairConta" title="Encerrar Sessão">🚪</button>
      </div>
    </header>

    <!-- ÁREA TOTAL DO MAPA -->
    <main class="driver-map-wrapper">
      <div id="mapaMotorista"></div>

      <!-- Pílula de Radar Discreta -->
      <div class="radar-status-badge" id="badgeRadarStatus">
        <span class="radar-ring-pulse"></span>
        <span id="txtRadarStatus">A rastrear chamadas...</span>
      </div>

      <!-- Botão Flutuante de Recentralizar GPS -->
      <button type="button" id="btnRecenterGPS" class="btn-recenter-gps" aria-label="Recentralizar GPS">
        📍
      </button>
    </main>

    <!-- PAINEL DESLIZANTE INFERIOR (FEED DE CHAMADAS) -->
    <section class="driver-bottom-dock">
      <div class="dock-grabber"></div>

      <!-- Filtros em Pílulas: Dedicado a Carro Particular -->
      <div class="dock-filters">
        <button type="button" class="filter-pill active" data-filter="carro">🚗 HUBy Viagem (Carro)</button>
        <button type="button" class="filter-pill" data-filter="todos">Todos</button>
      </div>

      <!-- Lista de Chamadas / Estado Vazio -->
      <div class="driver-feed" id="feedChamadas">
        <!-- Renderizado dinamicamente via app-motorista.js -->
      </div>
    </section>

  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="./js/modules/app-motorista.js"></script>

  <!-- Script para Carregar Dados do Perfil e Logout -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const nomeSalvo = localStorage.getItem('huby_motorista_nome') || 'Motorista Parceiro';
      const elNome = document.getElementById('lblNomeMotorista');
      const elAvatar = document.getElementById('lblAvatarMotorista');

      if (elNome) {
        elNome.textContent = nomeSalvo.split(' ')[0];
      }

      if (elAvatar) {
        const partes = nomeSalvo.trim().split(' ');
        const iniciais = partes.length > 1 
          ? (partes[0][0] + partes[partes.length - 1][0]).toUpperCase()
          : partes[0].substring(0, 2).toUpperCase();
        elAvatar.textContent = iniciais;
      }

      // Ação de Logout
      document.getElementById('btnSairConta')?.addEventListener('click', () => {
        if (confirm('Deseja realmente sair da sua conta de motorista?')) {
          localStorage.removeItem('huby_user_role');
          localStorage.removeItem('huby_parceiro_categoria');
          localStorage.removeItem('huby_motorista_id');
          localStorage.removeItem('huby_motorista_nome');
          window.location.href = './index.html';
        }
      });
    });
  </script>
</body>

</html>
