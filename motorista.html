<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>HUBy Motorista • Modo Parceiro</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="./css/base.css">
  
  <style>
    :root {
      --bg-dark: #090D16;
      --card-dark: #121826;
      --border-dark: rgba(255, 255, 255, 0.08);
      --emerald: #10B981;
      --emerald-glow: rgba(16, 185, 129, 0.2);
      --rose: #EF4444;
      --text-pri: #F8FAFC;
      --text-sec: #94A3B8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg-dark);
      color: var(--text-pri);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* MAPA EM TELA CHEIA */
    #mapaMotorista {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* BARRA SUPERIOR */
    .top-driver-nav {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .driver-pill, .btn-exit-partner {
      pointer-events: auto;
      background: rgba(18, 24, 38, 0.92);
      border: 1px solid var(--border-dark);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 8px 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .driver-pill strong {
      font-size: 15px;
      font-weight: 900;
      color: #FFF;
    }

    .driver-pill span { color: var(--emerald); }

    .btn-exit-partner {
      color: var(--text-sec);
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* DOCK INFERIOR DE CORRIDAS E CARTEIRA */
    .driver-dock {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      background: var(--card-dark);
      border-top: 1px solid var(--border-dark);
      border-radius: 20px 20px 0 0;
      padding: 16px;
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.6);
      max-height: 52vh;
      display: flex;
      flex-direction: column;
    }

    /* BARRA DE CARTEIRA E SAQUE */
    .wallet-card-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-dark);
      border-radius: 14px;
      padding: 10px 14px;
      margin-bottom: 12px;
    }

    .wallet-meta small {
      display: block;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--text-sec);
      letter-spacing: 0.4px;
    }

    .wallet-meta .val-saldo {
      font-size: 20px;
      font-weight: 900;
      color: var(--emerald);
      letter-spacing: -0.3px;
    }

    .btn-action-pix {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: var(--emerald);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-action-pix:active {
      transform: scale(0.95);
      background: var(--emerald);
      color: #032017;
    }

    /* FEED DE CHAMADAS PENDENTES */
    .orders-feed {
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 2px;
    }

    .dock-empty {
      text-align: center;
      color: var(--text-sec);
      font-size: 13px;
      padding: 24px 10px;
      font-weight: 600;
    }

    .order-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-dark);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .order-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .order-badge {
      background: rgba(255, 255, 255, 0.08);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
      color: #FFF;
      text-transform: uppercase;
    }

    .order-price {
      font-size: 17px;
      font-weight: 900;
      color: var(--emerald);
    }

    .order-route {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 12px;
      color: #CBD5E1;
    }

    .btn-accept-order {
      background: var(--emerald);
      color: #032017;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      width: 100%;
    }

    /* MODAL DE SAQUE PIX */
    .modal-saque-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-saque-card {
      background: var(--card-dark);
      border: 1px solid var(--border-dark);
      border-radius: 16px;
      width: 100%;
      max-width: 380px;
      padding: 18px;
    }

    .modal-saque-card h3 {
      margin: 0 0 6px;
      font-size: 16px;
      font-weight: 800;
      color: #FFF;
    }

    .modal-saque-card p {
      margin: 0 0 14px;
      font-size: 11px;
      color: var(--text-sec);
    }

    .form-field-saque {
      margin-bottom: 10px;
      text-align: left;
    }

    .form-field-saque label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-sec);
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .form-field-saque input, .form-field-saque select {
      width: 100%;
      background: #090D16;
      border: 1px solid var(--border-dark);
      border-radius: 8px;
      padding: 8px 10px;
      color: #FFF;
      font-size: 13px;
      font-weight: 700;
    }

    .modal-saque-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .btn-modal-cancel {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-dark);
      color: var(--text-sec);
      padding: 9px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-modal-submit {
      flex: 1.5;
      background: var(--emerald);
      border: none;
      color: #032017;
      padding: 9px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- NAVEGAÇÃO SUPERIOR -->
  <header class="top-driver-nav">
    <div class="driver-pill">
      <div style="width: 8px; height: 8px; border-radius: 50%; background: #10B981; box-shadow: 0 0 8px #10B981;"></div>
      <strong>HUB<span>y</span> Motorista</strong>
    </div>
    <a href="./index.html" class="btn-exit-partner">← Modo Passageiro</a>
  </header>

  <!-- MAPA LEAFLET -->
  <div id="mapaMotorista"></div>

  <!-- DOCK DE GESTÃO E RADAR -->
  <section class="driver-dock">
    
    <!-- BARRA DE CARTEIRA -->
    <div class="wallet-card-row">
      <div class="wallet-meta">
        <small>Saldo Disponível (85%)</small>
        <div class="val-saldo" id="saldoCarteiraValor">R$ 0,00</div>
      </div>
      <button type="button" id="btnAbrirModalSaque" class="btn-action-pix">
        Solicitar Saque Pix
      </button>
    </div>

    <!-- FEED DE CORRIDAS -->
    <div class="orders-feed" id="listaChamadasPendentes">
      <div class="dock-empty">Aguardando novas chamadas na região...</div>
    </div>
  </section>

  <!-- MODAL DE SAQUE PIX -->
  <div id="modalSaquePix" class="modal-saque-backdrop">
    <div class="modal-saque-card">
      <h3>Solicitar Saque Pix</h3>
      <p>O valor é debitado do saldo e enviado à sua chave após liquidação.</p>

      <div class="form-field-saque">
        <label>Tipo de Chave</label>
        <select id="saqueTipoChave">
          <option value="cpf">CPF</option>
          <option value="telefone">Telefone</option>
          <option value="email">E-mail</option>
          <option value="aleatoria">Chave Aleatória</option>
        </select>
      </div>

      <div class="form-field-saque">
        <label>Chave Pix de Recebimento</label>
        <input type="text" id="saqueChavePix" placeholder="Digite sua chave Pix">
      </div>

      <div class="form-field-saque">
        <label>Valor Pretendido (R$)</label>
        <input type="number" step="1" id="saqueValor" placeholder="Ex: 50.00">
      </div>

      <div class="modal-saque-actions">
        <button type="button" id="btnFecharModalSaque" class="btn-modal-cancel">Cancelar</button>
        <button type="button" id="btnConfirmarSaquePix" class="btn-modal-submit">Confirmar Saque</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="./js/app-motorista.js"></script>
</body>
</html>
