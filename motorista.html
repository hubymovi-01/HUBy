<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>HUBy Condutor - Radar de Parceiro</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

  <!-- Estilos HUBy -->
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/motorista.css">
</head>
<body>

  <div class="driver-viewport">
    <!-- 1. MAPA LEAFLET -->
    <div id="mapaMotorista"></div>

    <!-- 2. BARRA DE CONTROLO SUPERIOR -->
    <header class="driver-top-bar">
      <div class="driver-status-card">
        <small id="txtParceiroNome">Parceiro</small>
        <strong id="txtStatusTexto">A aguardar sinal...</strong>
      </div>
      <button type="button" class="btn-toggle-status" id="btnToggleStatus">
        ONLINE
      </button>
    </header>

    <!-- 3. GAVETA INFERIOR: RADAR DE CHAMADAS -->
    <section class="driver-dock">
      <div class="dock-header">
        <span class="dock-title">Radar de Chamadas</span>
        <span id="txtTotalPendentes" style="font-size: 11px; color: var(--text-muted); font-weight: 700;">0 disponíveis</span>
      </div>

      <!-- Feed dinâmico de solicitações -->
      <div class="orders-feed" id="feedPedidos">
        <div class="dock-empty">
          A procurar viagens e fretes próximos...
        </div>
      </div>
    </section>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Script Principal do Condutor -->
  <script type="module" src="./js/app-motorista.js"></script>
</body>
</html>
