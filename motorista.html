<!DOCTYPE html>
<html lang="pt-PT">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HUBy HUby - Painel do Motorista</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#080C14">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Estilos Globais e do Motorista -->
  <link rel="stylesheet" href="./css/global.css">
  <link rel="stylesheet" href="./css/motorista.css">
</head>

<body>
  <div class="driver-layout">

    <!-- BARRA SUPERIOR DO MOTORISTA (GLASS FLUTUANTE) -->
    <header class="driver-topbar">
      <div class="driver-profile-pill">
        <div class="avatar-circle">TC</div>
        <div class="profile-info">
          <span class="driver-name">Tarcyo C.</span>
          <span class="driver-rating">⭐ 4.98</span>
        </div>
      </div>

      <div class="topbar-actions">
        <button type="button" id="btnToggleStatus" class="btn-status-toggle status-online">
          <span class="status-pulse-dot"></span>
          <strong id="txtStatusMotorista">ONLINE</strong>
        </button>
        <a href="./index.html" class="btn-mode-switch">Modo Passageiro ➔</a>
      </div>
    </header>

    <!-- CARDS DE METRICAS FLUTUANTES -->
    <section class="driver-stats-bar">
      <div class="stat-card">
        <span class="stat-label">Ganhos Hoje</span>
        <strong class="stat-val highlight" id="statGanhosHoje">R$ 184,50</strong>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-card">
        <span class="stat-label">Corridas</span>
        <strong class="stat-val" id="statCorridasHoje">7</strong>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-card">
        <span class="stat-label">Carteira</span>
        <strong class="stat-val" id="statSaldoCarteira">R$ 412,00</strong>
      </div>
    </section>

    <!-- MAPA DO MOTORISTA -->
    <main class="driver-map-viewport">
      <div id="mapaMotorista"></div>

      <!-- Pílula Flutuante de Radar de Satélite -->
      <div class="radar-pill" id="badgeRadarStatus">
        <span class="radar-ring"></span>
        <span class="radar-center"></span>
        <span id="txtRadarStatus">Radar ativo • A procurar corridas e fretes...</span>
      </div>
    </main>

    <!-- BOTTOM SHEET DE CHAMADAS / RADAR -->
    <section class="driver-sheet">
      <div class="sheet-handle"></div>

      <!-- Filtro Rápido de Categorias -->
      <div class="driver-filter-tabs">
        <button type="button" class="tab-chip active" data-filter="todos">Todos</button>
        <button type="button" class="tab-chip" data-filter="carro">🚗 Viagem</button>
        <button type="button" class="tab-chip" data-filter="flash">📦 Flash</button>
        <button type="button" class="tab-chip" data-filter="cargo">🚚 Cargo</button>
      </div>

      <!-- Feed Dinâmico de Pedidos -->
      <div class="jobs-stream" id="feedChamadas">
        <!-- Injetado dinamicamente via JS -->
      </div>
    </section>

  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="./js/modules/app-motorista.js"></script>
</body>

</html>
