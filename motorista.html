<!DOCTYPE html>
<html lang="pt-PT">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>HUBy Motorista - Radar em Tempo Real</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#080C14">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- CSS Exclusivo e Otimizado do Motorista -->
  <link rel="stylesheet" href="./css/motorista.css">
</head>

<body>
  <div class="driver-layout">

    <!-- CABEÇALHO UNIFICADO E COMPACTO -->
    <header class="driver-header">
      <div class="header-left">
        <div class="driver-avatar">TC</div>
        <div class="driver-meta">
          <div class="meta-row">
            <span class="d-name">Tarcyo</span>
            <span class="d-badge">⭐ 4.98</span>
          </div>
          <span class="d-earnings" id="statGanhosHoje">Hoje: <strong>R$ 184,50</strong> (7 corridas)</span>
        </div>
      </div>

      <div class="header-right">
        <button type="button" id="btnToggleStatus" class="btn-toggle-online status-online">
          <span class="pulse-indicator"></span>
          <span id="txtStatusMotorista">ONLINE</span>
        </button>
        <a href="./index.html" class="btn-mode-icon" title="Voltar para Modo Passageiro">🔄</a>
      </div>
    </header>

    <!-- ÁREA TOTAL DO MAPA -->
    <main class="driver-map-wrapper">
      <div id="mapaMotorista"></div>

      <!-- Pílula de Radar Discreta -->
      <div class="radar-status-badge" id="badgeRadarStatus">
        <span class="radar-ring-pulse"></span>
        <span id="txtRadarStatus">A rastrear chamadas...</span>
      </div>

      <!-- Botão Flutuante de Recentralizar GPS -->
      <button type="button" id="btnRecenterGPS" class="btn-recenter-gps" aria-label="Recentralizar GPS">
        📍
      </button>
    </main>

    <!-- PAINEL DESLIZANTE INFERIOR (FEED DE CHAMADAS) -->
    <section class="driver-bottom-dock">
      <div class="dock-grabber"></div>

      <!-- Filtros em Pílulas -->
      <div class="dock-filters">
        <button type="button" class="filter-pill active" data-filter="todos">Todos</button>
        <button type="button" class="filter-pill" data-filter="carro">🚗 Viagem</button>
        <button type="button" class="filter-pill" data-filter="flash">📦 Flash</button>
        <button type="button" class="filter-pill" data-filter="cargo">🚚 Cargo</button>
      </div>

      <!-- Lista de Chamadas / Estado Vazio -->
      <div class="driver-feed" id="feedChamadas">
        <!-- Renderizado dinamicamente via JS -->
      </div>
    </section>

  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="./js/modules/app-motorista.js"></script>
</body>

</html>
