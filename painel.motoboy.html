<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>HUBy Flash & Moto - Radar do Entregador</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#080C14">

  <!-- GUARDA DE PERFIL: Valida se é parceiro autenticado -->
  <script>
    (function () {
      const papel = localStorage.getItem('huby_user_role');
      if (papel !== 'motorista') {
        window.location.replace('./login.html');
      }
    })();
  </script>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- CSS Compartilhado do Parceiro -->
  <link rel="stylesheet" href="./css/motorista.css">
</head>

<body>
  <div class="driver-layout">

    <!-- CABEÇALHO DEDICADO MOTO / FLASH -->
    <header class="driver-header">
      <div class="header-left">
        <div class="driver-avatar" id="lblAvatarMotorista" style="background: linear-gradient(135deg, #38BDF8, #0284C7);">⚡</div>
        <div class="driver-meta">
          <div class="meta-row">
            <span class="d-name" id="lblNomeMotorista">Entregador</span>
            <span class="d-badge" style="background: rgba(56, 189, 248, 0.15); color: #38BDF8;">🛵 Flash & Moto</span>
          </div>
          <!-- IDs sincronizados com app-motorista.js -->
          <span class="d-earnings">Hoje: <strong id="txtGanhosHoje">R$ 0,00</strong> (<span id="txtQtdCorridas">0 corridas</span>)</span>
        </div>
      </div>

      <div class="header-right">
        <button type="button" id="btnToggleStatus" class="btn-toggle-online status-online">
          <span class="pulse-indicator"></span>
          <span id="txtStatusMotorista">ONLINE</span>
        </button>
        <button type="button" class="btn-mode-icon" id="btnSairConta" title="Encerrar Sessão">🚪</button>
      </div>
    </header>

    <!-- ÁREA TOTAL DO MAPA -->
    <main class="driver-map-wrapper">
      <div id="mapaMotorista"></div>

      <div class="radar-status-badge" id="badgeRadarStatus">
        <span class="radar-ring-pulse"></span>
        <span id="txtRadarStatus">A rastrear encomendas e chamadas moto...</span>
      </div>

      <button type="button" id="btnRecenterGPS" class="btn-recenter-gps" aria-label="Recentralizar GPS">
        📍
      </button>
    </main>

    <!-- PAINEL DESLIZANTE INFERIOR: FILTROS DEDICADOS PARA DUAS RODAS -->
    <section class="driver-bottom-dock">
      <div class="dock-grabber"></div>

      <!-- Apenas modalidades compatíveis com moto -->
      <div class="dock-filters">
        <button type="button" class="filter-pill active" data-filter="flash">📦 Flash Encomendas</button>
        <button type="button" class="filter-pill" data-filter="moto">🛵 HUBy Moto</button>
      </div>

      <!-- Feed Dinâmico -->
      <div class="driver-feed" id="feedChamadas"></div>
    </section>

  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="./js/modules/app-motorista.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const nomeSalvo = localStorage.getItem('huby_motorista_nome') || 'Parceiro Flash';
      const elNome = document.getElementById('lblNomeMotorista');
      const elAvatar = document.getElementById('lblAvatarMotorista');

      if (elNome) elNome.textContent = nomeSalvo.split(' ')[0];

      if (elAvatar && nomeSalvo !== 'Parceiro Flash') {
        const partes = nomeSalvo.trim().split(' ');
        elAvatar.textContent = partes.length > 1 
          ? (partes[0][0] + partes[partes.length - 1][0]).toUpperCase()
          : partes[0].substring(0, 2).toUpperCase();
      }

      document.getElementById('btnSairConta')?.addEventListener('click', () => {
        if (confirm('Deseja realmente sair da sua conta de entregador?')) {
          localStorage.removeItem('huby_user_role');
          localStorage.removeItem('huby_parceiro_categoria');
          localStorage.removeItem('huby_motorista_id');
          localStorage.removeItem('huby_motorista_nome');
          localStorage.removeItem('huby_motorista_placa');
          window.location.href = './index.html';
        }
      });
    });
  </script>
</body>

</html>
